<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>chen_space</title>
    <style>
        /* ===== 全局重置 & 基础 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            color: white;
            overflow-x: hidden;
            background-color: #1a1a2e;
            background-image: url('img.jpg');
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            transition: background 0.8s ease, background-color 0.8s ease;
            /* 添加背景切换过渡 */;
        }

        body.dark-mode {
            background-image: none !important;
            background-color: #000000 !important;
        }

        body.bg-img5 {
            background-image: url('img5.jpg') !important;
        }

        /* 暗黑模式优先，覆盖背景切换 */
        body.dark-mode.bg-img5 {
            background-image: none !important;
            background-color: #000000 !important;
        }

        /* ===== 模糊覆盖层（底部羽化） ===== */
        .blur-overlay {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0;
            background: transparent;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            z-index: 1;
            pointer-events: none;
            transition: height 0.08s ease-out;
            -webkit-mask-image: linear-gradient(to top, black 0%, black 65%, transparent 100%);
            mask-image: linear-gradient(to top, black 0%, black 65%, transparent 100%);
            -webkit-mask-composite: source-over;
            mask-composite: add;
        }

        /* ===== 导航栏 ===== */
        .navbar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 700px;
            padding: 12px 24px;
            background: rgba(10, 10, 30, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 1000;
            opacity: 0;
            transform: translateX(-50%) translateY(-20px);
            animation: navFadeIn 0.8s cubic-bezier(0.23, 1, 0.32, 1) forwards;
            animation-delay: 0.3s;
        }

        @keyframes navFadeIn {
            0% {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }
            100% {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .device-indicator {
            font-size: 0.75rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            white-space: nowrap;
            letter-spacing: 0.3px;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .nav-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 0.8px;
            white-space: nowrap;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .nav-buttons {
            display: flex;
            gap: 12px;
            flex-shrink: 0;
        }

        .nav-btn {
            padding: 6px 22px;
            border: none;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            letter-spacing: 0.5px;
            font-family: inherit;
            white-space: nowrap;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: scale(1.04);
            border-color: rgba(255, 255, 255, 0.2);
            color: white;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.08);
        }

        .nav-btn:active {
            transform: scale(0.96);
        }

        /* ===== 主布局 ===== */
        .main-wrapper {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 20px 100px;
        }

        .hero-section {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding-top: 40px;
        }

        /* ===== 顶部内容框 ===== */
        .content {
            max-width: 80vw;
            padding: 1.8rem 2.2rem;
            background: rgba(10, 10, 30, 0.3);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
            transition: transform 0.2s ease, background 0.5s ease, border-color 0.5s ease;
            opacity: 0;
            transform: translateY(50px);
            animation: fadeUp 1s cubic-bezier(0.23, 1, 0.32, 1) forwards;
            animation-delay: 0.1s;
            margin-top: 60px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        body.dark-mode .content {
            background: rgba(0, 0, 0, 0.7);
            border-color: rgba(255, 0, 0, 0.3);
        }

        body.dark-mode .card {
            border-color: rgba(255, 255, 255, 0.15);
        }

        .content:hover {
            transform: scale(1.01);
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(50px);
                text-shadow: 0 0 0 rgba(255, 255, 255, 0);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
                text-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
            }
        }

        /* ===== 打字机文字 ===== */
        .dynamic-text {
            font-size: clamp(2.8rem, 8vw, 5rem);
            font-weight: 700;
            letter-spacing: 0.03em;
            color: white;
            text-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            line-height: 1.2;
            min-height: 1.4em;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            position: relative;
            transition: color 0.4s ease;
        }

        .dynamic-text.red-mode {
            color: #ff1744 !important;
            text-shadow: 0 0 40px rgba(255, 23, 68, 0.4);
        }

        .dynamic-text::after {
            content: '|';
            display: inline-block;
            margin-left: 2px;
            font-weight: 300;
            opacity: 0.7;
            animation: blinkCursor 0.9s step-end infinite;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9em;
            transition: color 0.4s ease;
        }

        .dynamic-text.red-mode::after {
            color: #ff1744;
        }

        .dynamic-text.no-cursor::after {
            content: none;
            animation: none;
            opacity: 0;
        }

        @keyframes blinkCursor {
            0%,
            100% {
                opacity: 0.7;
            }
            50% {
                opacity: 0;
            }
        }

        /* ===== 长圆玻璃按钮 ===== */
        .btn-glass {
            display: inline-block;
            padding: 14px 48px;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            font-family: inherit;
            user-select: none;
        }

        .btn-glass:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.02);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .btn-glass:active {
            transform: scale(0.97);
        }

        body.dark-mode .btn-glass {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.08);
        }

        body.dark-mode .btn-glass:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        /* ================================================================
               卡片区域 — 统一高度 + 滚动缩放 + 毛玻璃
               ================================================================ */
        .cards-section {
            width: 100%;
            max-width: 960px;
            margin-top: 40px;
            padding-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 80px;
            flex-shrink: 0;
            opacity: 1;
            transform: none;
        }

        .card {
            --scale: 1;
            transform: scale(var(--scale)) translateY(0);
            transform-origin: center center;
            will-change: transform;

            /* ===== 毛玻璃效果 ===== */
            background: rgba(20, 20, 40, 0.35);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 5px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);

            border-radius: 24px;
            padding: 40px 35px;
            height: 280px;
            transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                box-shadow 0.25s ease,
                border-color 0.5s ease,
                background 0.3s ease;
            width: 100%;
            display: flex;
            flex-direction: row;
            align-items: stretch;
            justify-content: space-between;
            cursor: pointer;
            overflow: hidden;
        }

        .card:hover {
            transform: scale(calc(var(--scale) * 1.02)) translateY(-4px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            background: rgba(30, 30, 60, 0.45);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .card:active {
            transform: scale(calc(var(--scale) * 0.97)) translateY(0);
        }

        body.dark-mode .card {
            background: rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.1);
        }

        body.dark-mode .card:hover {
            background: rgba(0, 0, 0, 0.6);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .card-content {
            display: flex;
            flex-direction: column;
            flex: 1 1 auto;
            min-width: 0;
            pointer-events: none;
            overflow: hidden;
            justify-content: flex-start;
            align-items: flex-start;
        }

        .card-title {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            color: #ffffff;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .card-body {
            font-size: 1.15rem;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 300;
            letter-spacing: 0.3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
        }

        .card-image {
            flex-shrink: 0;
            margin-left: 25px;
            max-width: 140px;
            max-height: 160px;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }

        .card-image img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        .card-emoji {
            font-size: 110px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: auto;
            text-align: center;
            user-select: none;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.3));
        }

        /* ================================================================
               全屏新卡片页 — 铺满视口，长距离左右滑动入场 + 毛玻璃
               ================================================================ */
        .fullpage-section {
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 40px 80px;
        }

        .fullpage-inner {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: stretch;
        }

        /* 左侧列 — 更长的滑入距离 */
        .fullpage-left {
            display: flex;
            flex-direction: column;
            gap: 40px;
            opacity: 0;
            transform: translateX(-220px);
            transition: opacity 1.5s cubic-bezier(0.23, 1, 0.32, 1),
                transform 1.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .fullpage-left.visible {
            opacity: 1;
            transform: translateX(0);
        }

        /* 右侧列 — 更长的滑入距离 */
        .fullpage-right {
            display: flex;
            opacity: 0;
            transform: translateX(220px);
            transition: opacity 1.5s cubic-bezier(0.23, 1, 0.32, 1),
                transform 1.5s cubic-bezier(0.23, 1, 0.32, 1);
            transition-delay: 0.15s;
        }

        .fullpage-right.visible {
            opacity: 1;
            transform: translateX(0);
        }

        /* 全屏卡片 — 毛玻璃 + 大号字体 */
        .fullpage-card {
            background: rgba(20, 20, 40, 0.35);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 5px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);

            border-radius: 28px;
            padding: 45px 40px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            width: 100%;
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.3s ease;
            overflow: hidden;
            flex: 1;
            min-height: 280px;
        }

        .fullpage-card:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
            background: rgba(30, 30, 60, 0.45);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .fullpage-card:active {
            transform: scale(0.97);
        }

        body.dark-mode .fullpage-card {
            background: rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.1);
        }

        body.dark-mode .fullpage-card:hover {
            background: rgba(0, 0, 0, 0.6);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .fullpage-card .card-title {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
            color: #ffffff;
            line-height: 1.2;
            white-space: normal;
            overflow: visible;
            text-overflow: unset;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .fullpage-card .card-body {
            font-size: 1.6rem;
            line-height: 1.7;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 300;
            letter-spacing: 0.3px;
            white-space: normal;
            overflow: visible;
            text-overflow: unset;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
        }

        .fullpage-left .fullpage-card {
            min-height: 260px;
        }

        .fullpage-right .fullpage-card {
            min-height: 560px;
        }

        /* ================================================================
               Dock 栏 — 底部毛玻璃
               ================================================================ */
        .dock-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 14px 24px;
            background: rgba(10, 10, 30, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.3);
            z-index: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 28px;
            transform: translateY(100%);
            transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            opacity: 0;
            visibility: hidden;
            transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1),
                opacity 0.4s ease,
                visibility 0s 0.5s;
        }

        .dock-bar.visible {
            transform: translateY(0);
            opacity: 1;
            visibility: visible;
            transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1),
                opacity 0.4s ease,
                visibility 0s 0s;
        }

        .dock-text {
            font-size: 1rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.75);
            letter-spacing: 1px;
        }

        .dock-home-btn {
            padding: 8px 28px;
            border: none;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            background: rgba(255, 255, 255, 0.12);
            color: white;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-family: inherit;
            letter-spacing: 0.5px;
        }

        .dock-home-btn:hover {
            background: rgba(255, 255, 255, 0.22);
            transform: scale(1.04);
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.06);
        }

        .dock-home-btn:active {
            transform: scale(0.95);
        }

        body.dark-mode .dock-bar {
            background: rgba(0, 0, 0, 0.7);
            border-top-color: rgba(255, 255, 255, 0.05);
        }

        body.dark-mode .dock-home-btn {
            background: rgba(255, 255, 255, 0.08);
        }

        body.dark-mode .dock-home-btn:hover {
            background: rgba(255, 255, 255, 0.16);
        }

        /* ===== 滚动条 ===== */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.25);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        /* ================================================================
               响应式
               ================================================================ */
        @media (max-width: 968px) {
            .fullpage-inner {
                grid-template-columns: 1fr;
                gap: 40px;
            }
            .fullpage-right .fullpage-card {
                min-height: 260px;
            }
            .fullpage-left .fullpage-card {
                min-height: 220px;
            }
            .fullpage-card .card-title {
                font-size: 2.4rem;
            }
            .fullpage-card .card-body {
                font-size: 1.3rem;
            }
            .fullpage-section {
                padding: 100px 30px 80px;
            }
            .fullpage-left {
                transform: translateX(-150px);
            }
            .fullpage-right {
                transform: translateX(150px);
            }
        }

        @media (max-width: 768px) {
            .content {
                padding: 1.4rem 1.6rem;
                max-width: 85vw;
                gap: 16px;
            }
            .dynamic-text {
                font-size: clamp(2.2rem, 7vw, 3.6rem);
            }
            .navbar {
                padding: 10px 18px;
                gap: 10px;
                top: 16px;
                width: 92%;
                flex-wrap: nowrap;
            }
            .nav-title {
                font-size: 0.95rem;
            }
            .nav-btn {
                padding: 5px 14px;
                font-size: 0.75rem;
            }
            .device-indicator {
                font-size: 0.65rem;
                padding: 1px 10px;
            }
            .nav-left {
                gap: 6px;
            }

            .card {
                height: 240px;
                padding: 30px 25px;
                border-width: 4px;
                flex-wrap: nowrap;
            }
            .card-title {
                font-size: 1.8rem;
            }
            .card-body {
                font-size: 1.0rem;
            }
            .card-image {
                max-width: 110px;
                max-height: 130px;
                margin-left: 20px;
            }
            .card-emoji {
                font-size: 90px;
            }
            .cards-section {
                gap: 60px;
            }
            .btn-glass {
                padding: 12px 32px;
                font-size: 0.9rem;
            }
            .dock-bar {
                padding: 12px 18px;
                gap: 18px;
            }
            .dock-text {
                font-size: 0.85rem;
            }
            .dock-home-btn {
                padding: 6px 20px;
                font-size: 0.8rem;
            }

            .fullpage-section {
                padding: 80px 20px 80px;
                min-height: auto;
            }
            .fullpage-inner {
                gap: 30px;
            }
            .fullpage-left {
                gap: 30px;
                transform: translateX(-100px);
            }
            .fullpage-right {
                transform: translateX(100px);
            }
            .fullpage-card {
                padding: 30px 25px;
                min-height: 200px !important;
                border-width: 4px;
            }
            .fullpage-card .card-title {
                font-size: 2.0rem;
            }
            .fullpage-card .card-body {
                font-size: 1.1rem;
            }
        }

        @media (max-width: 480px) {
            .hero-section {
                min-height: 60vh;
            }
            .content {
                padding: 1.2rem 1.2rem;
                border-radius: 1.8rem;
                margin-top: 40px;
                max-width: 92vw;
                gap: 14px;
            }
            .dynamic-text {
                font-size: clamp(1.8rem, 6vw, 2.8rem);
            }
            .navbar {
                padding: 8px 14px;
                gap: 8px;
                border-radius: 40px;
            }
            .nav-title {
                font-size: 0.8rem;
            }
            .nav-btn {
                padding: 4px 10px;
                font-size: 0.65rem;
                border-radius: 20px;
            }
            .nav-buttons {
                gap: 6px;
            }
            .device-indicator {

                padding: 1px 8px;
            }
            .nav-left {
                gap: 4px;

            .card {
                height: 200px;

                border-radius: 18px;

            .card-body {

            }
            .card-image {
                max-width: 80px;
                max-height: 100px;
                margin-left: 14px;
            }
            .card-emoji {
                font-size: 70px;
            }
            .cards-section {
                gap: 40px;
            }
            .btn-glass {
                padding: 10px 24px;
                font-size: 0.8rem;
            }
            .dock-bar {
                padding: 10px 14px;
                gap: 14px;
                flex-wrap: wrap;
            }
            .dock-text {
                font-size: 0.75rem;
            }
            .dock-home-btn {
                padding: 5px 14px;
                font-size: 0.7rem;
            }

            .fullpage-section {
                padding: 60px 16px 80px;
            }
            .fullpage-inner {
                gap: 20px;
            }
            .fullpage-left {
                gap: 20px;
                transform: translateX(-60px);
            }
            .fullpage-right {
                transform: translateX(60px);
            }
            .fullpage-card {
                padding: 22px 18px;
                min-height: 160px !important;
                border-radius: 20px;
                border-width: 4px;
            }
            .fullpage-card .card-title {
                font-size: 1.6rem;
                margin-bottom: 10px;
            }
            .fullpage-card .card-body {
                font-size: 0.95rem;
            }
        }

        @media (max-width: 380px) {
            .dynamic-text {
                font-size: clamp(1.5rem, 5vw, 2.2rem);
            }
            .nav-title {
                font-size: 0.7rem;
            }
            .nav-btn {
                font-size: 0.6rem;
                padding: 3px 8px;
            }
            .device-indicator {
                font-size: 0.5rem;
                padding: 1px 6px;
            }

            .card {
                height: 170px;
                padding: 16px 14px;
                border-width: 3px;
            }
            .card-title {
                font-size: 1.1rem;
            }
            .card-body {
                font-size: 0.8rem;
            }
            .card-image {
                max-width: 65px;
                max-height: 80px;
                margin-left: 10px;
            }
            .card-emoji {
                font-size: 55px;
            }
            .cards-section {
                gap: 32px;
            }
            .btn-glass {
                padding: 8px 18px;
                font-size: 0.7rem;
            }
            .dock-bar {
                padding: 8px 12px;
                gap: 10px;
            }
            .dock-text {
                font-size: 0.65rem;
            }
            .dock-home-btn {
                padding: 4px 12px;
                font-size: 0.6rem;
            }

            .fullpage-card {
                padding: 18px 14px;
                min-height: 140px !important;
                border-radius: 16px;
                border-width: 3px;
            }
            .fullpage-card .card-title {
                font-size: 1.3rem;
            }
            .fullpage-card .card-body {
                font-size: 0.8rem;
            }

            }
            .fullpage-right {

            }
        }

</head>
<body>
    <!-- ===== 模糊覆盖层 ===== -->
    <div class="blur-overlay" id="blurOverlay"></div>

    <!-- ===== 导航栏 ===== -->
    <nav class="navbar">
        <div class="nav-left">
            <span class="device-indicator" id="deviceIndicator">💻</span>
            <span class="nav-title">✦ chen的空间</span>
        </div>
        <div class="nav-buttons">
            <button class="nav-btn" id="homeBtn">🏠 首页</button>
            <button class="nav-btn" id="themeBtn">🎨 主题切换</button>
        </div>
    </nav>

    <!-- ===== 主体 ===== -->
    <div class="main-wrapper">

        <!-- 顶部区域 -->
        <section class="hero-section">
            <div class="content" id="contentWrapper">
                <div class="dynamic-text" id="typingText">welcome</div>
                <button class="btn-glass" id="circleBtn">✦ chen的空间</button>
            </div>
        </section>

        <!-- 原有卡片区域 -->
        <section class="cards-section" id="cardsSection">
            <div class="card" id="card1">
                <div class="card-content">
                    <div class="card-title">ai牛逼</div>
                    <div class="card-body">5万token做的网页！</div>
                </div>
                <div class="card-image">
                    <img src="img1.jpg" alt="img1.jpg" />
                </div>
            </div>

            <div class="card" id="card2">
                <div class="card-content">
                    <div class="card-title">极致的网页美观</div>
                    <div class="card-body">正如标题所述</div>
                </div>
                <div class="card-image">
                    <span class="card-emoji">🎨</span>
                </div>
            </div>

            <div class="card" id="card3">
                <div class="card-content">
                    <div class="card-title">我还没做完呢，先上传试试</div>
                    <div class="card-body">往下拉个头</div>
                </div>
                <div class="card-image">
                    <img src="img3.png" alt="img3.png" />
                </div>
            </div>
        </section>

        <!-- ===== 全屏新卡片页 ===== -->
        <section class="fullpage-section" id="fullpageSection">
            <div class="fullpage-inner">
                <!-- 左侧列 -->
                <div class="fullpage-left" id="fullpageLeft">
                    <div class="fullpage-card" id="card4">
                        <div class="card-content">
                            <div class="card-title">这个空间有什么鸟有？</div>
                            <div class="card-body">没啥鸟有，就分享资源，学术交流😋😋</div>
                        </div>
                    </div>
                    <div class="fullpage-card" id="card5">
                        <div class="card-content">
                            <div class="card-title">有bug?</div>
                            <div class="card-body">正常啦，没有反馈入口hhh🤣(bushi)</div>
                        </div>
                    </div>
                </div>
                <!-- 右侧列 -->
                <div class="fullpage-right" id="fullpageRight">
                    <div class="fullpage-card" id="card6">
                        <div class="card-content">
                            <div class="card-title">就这点？</div>
                            <div class="card-body">还在写，莫催</div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </div>

    <!-- ===== Dock 栏 ===== -->
    <div class="dock-bar" id="dockBar">
        <span class="dock-text">🏁 到底了</span>
        <button class="dock-home-btn" id="dockHomeBtn">首页</button>
    </div>

    <script>
        (function() {
            'use strict';

            // ================================================================
            //  1. 打字机动画
            // ================================================================
            const textEl = document.getElementById('typingText');
            const words = ['welcome', '你好', '欢迎来到我的空间', '无限进步'];
            let currentIndex = 0;
            let currentText = words[currentIndex];
            let displayText = '';
            let pos = 0;
            let timer = null;
            let isWaiting = false;
            let waitStartTime = 0;
            const WAIT_DURATION = 3000;
            const CHAR_INTERVAL = 70;
            let lastCharTime = 0;
            let mode = 'typing';
            let isStopped = false;

            function clearTimer() {
                if (timer) {
                    cancelAnimationFrame(timer);
                    timer = null;
                }
            }

            function updateDisplay() {
                textEl.textContent = displayText;
            }

            function switchToNextWord() {
                if (isStopped) return;
                currentIndex = (currentIndex + 1) % words.length;
                currentText = words[currentIndex];
                displayText = '';
                pos = 0;
                mode = 'typing';
                isWaiting = false;
                lastCharTime = performance.now();
                updateDisplay();
                step(performance.now());
            }

            function step(timestamp) {
                if (isStopped) return;
                if (!timestamp) timestamp = performance.now();

                if (isWaiting) {
                    if (timestamp - waitStartTime >= WAIT_DURATION) {
                        isWaiting = false;
                        mode = 'deleting';
                        lastCharTime = timestamp;
                        timer = requestAnimationFrame(step);
                    } else {
                        timer = requestAnimationFrame(step);
                    }
                    return;
                }

                if (mode === 'typing') {
                    if (timestamp - lastCharTime >= CHAR_INTERVAL) {
                        if (pos < currentText.length) {
                            pos++;
                            displayText = currentText.substring(0, pos);
                            updateDisplay();
                            lastCharTime = timestamp;
                            if (pos === currentText.length) {
                                isWaiting = true;
                                waitStartTime = timestamp;
                                timer = requestAnimationFrame(step);
                                return;
                            }
                        }
                    }
                    timer = requestAnimationFrame(step);
                } else if (mode === 'deleting') {
                    if (timestamp - lastCharTime >= CHAR_INTERVAL) {
                        if (pos > 0) {
                            pos--;
                            displayText = currentText.substring(0, pos);
                            updateDisplay();
                            lastCharTime = timestamp;
                            if (pos === 0) {
                                switchToNextWord();
                                return;
                            }
                        }
                    }
                    timer = requestAnimationFrame(step);
                }
            }

            function startAnimation() {
                clearTimer();
                isStopped = false;
                displayText = '';
                pos = 0;
                currentIndex = 0;
                currentText = words[currentIndex];
                mode = 'typing';
                isWaiting = false;
                lastCharTime = performance.now();
                updateDisplay();
                textEl.classList.remove('no-cursor');
                textEl.classList.remove('red-mode');
                step(performance.now());
            }

            function stopTypingAndSetText(fixedText, isRed) {
                clearTimer();
                isStopped = true;
                textEl.textContent = fixedText;
                if (isRed) {
                    textEl.classList.add('red-mode');
                } else {
                    textEl.classList.remove('red-mode');
                }
                textEl.classList.add('no-cursor');
            }

            function resumeTyping() {
                clearTimer();
                isStopped = false;
                textEl.classList.remove('red-mode');
                textEl.classList.remove('no-cursor');
                displayText = '';
                pos = 0;
                currentIndex = 0;
                currentText = words[currentIndex];
                mode = 'typing';
                isWaiting = false;
                lastCharTime = performance.now();
                updateDisplay();
                step(performance.now());
            }

            startAnimation();

            window.addEventListener('beforeunload', function() {
                clearTimer();
            });

            // ================================================================
            //  2. DOM 引用 & 状态
            // ================================================================
            const circleBtn = document.getElementById('circleBtn');
            const bodyEl = document.body;
            const cards = document.querySelectorAll('.card');
            const dockBar = document.getElementById('dockBar');
            const dockHomeBtn = document.getElementById('dockHomeBtn');

            const fullpageLeft = document.getElementById('fullpageLeft');
            const fullpageRight = document.getElementById('fullpageRight');
            const fullpageSection = document.getElementById('fullpageSection');

            let isDarkMode = false;
            let isCard2Clicked = false;

            // ================================================================
            //  3. 主题切换
            // ================================================================
            function enterDarkMode() {
                if (isDarkMode) return;
                isDarkMode = true;
                bodyEl.classList.add('dark-mode');
                stopTypingAndSetText('质疑我审美？😡', true);
                circleBtn.textContent = '变回来';
            }

            // ================================================================
            //  4. 导航栏按钮
            // ================================================================
            document.getElementById('homeBtn').addEventListener('click', function(e) {
                e.preventDefault();
                this.style.transform = 'scale(0.94)';
                setTimeout(() => { this.style.transform = ''; }, 150);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            document.getElementById('themeBtn').addEventListener('click', function(e) {
                e.preventDefault();
                this.style.transform = 'scale(0.94)';
                setTimeout(() => { this.style.transform = ''; }, 150);
                if (!isDarkMode) {
                    enterDarkMode();
                }
            });

            // ================================================================
            //  5. 圆形按钮（长圆玻璃）
            // ================================================================
            circleBtn.addEventListener('click', function(e) {
                e.preventDefault();
                this.style.transform = 'scale(0.93)';
                setTimeout(() => { this.style.transform = ''; }, 150);

                let shouldReset = false;

                if (isDarkMode) {
                    isDarkMode = false;
                    bodyEl.classList.remove('dark-mode');
                    shouldReset = true;
                }

                if (isCard2Clicked) {
                    isCard2Clicked = false;
                    shouldReset = true;
                }

                if (shouldReset) {
                    resumeTyping();
                    circleBtn.textContent = '✦ chen的空间';
                }
            });

            // ================================================================
            //  6. 卡片点击事件
            // ================================================================
            document.getElementById('card1').addEventListener('click', function(e) {
                window.open('https://www.deepseek.com/', '_blank');
            });

            document.getElementById('card2').addEventListener('click', function(e) {
                if (!isDarkMode) {
                    stopTypingAndSetText('是不是很美观？', false);
                    isCard2Clicked = true;
                    circleBtn.textContent = '变回来';
                }
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            document.getElementById('card3').addEventListener('click', function(e) {
                // 仅反馈
            });

            document.getElementById('card4').addEventListener('click', function(e) {
                // 仅反馈
            });
            document.getElementById('card5').addEventListener('click', function(e) {
                // 仅反馈
            });
            document.getElementById('card6').addEventListener('click', function(e) {
                // 仅反馈
            });

            // ================================================================
            //  7. 滚动缩放卡片（仅对原有卡片生效）
            // ================================================================
            const MIN_SCALE = 0.30;
            const NORMAL_SCALE = 1.0;
            const THRESHOLD_TOP = 0.70;
            const THRESHOLD_BOTTOM = 1.00;

            function updateCardScales() {
                const windowHeight = window.innerHeight;
                const thresholdTopPx = windowHeight * THRESHOLD_TOP;
                const thresholdBottomPx = windowHeight * THRESHOLD_BOTTOM;
                const range = thresholdBottomPx - thresholdTopPx;

                cards.forEach(function(card) {
                    const rect = card.getBoundingClientRect();
                    const top = rect.top;

                    let scale = NORMAL_SCALE;

                    if (top <= thresholdTopPx) {
                        scale = NORMAL_SCALE;
                    } else if (top >= thresholdBottomPx) {
                        scale = MIN_SCALE;
                    } else {
                        const progress = (top - thresholdTopPx) / range;
                        scale = NORMAL_SCALE - (NORMAL_SCALE - MIN_SCALE) * progress;
                    }

                    card.style.setProperty('--scale', scale);
                });
            }

            let ticking = false;

            function onScroll() {
                if (!ticking) {
                    window.requestAnimationFrame(function() {
                        updateCardScales();
                        ticking = false;
                    });
                    ticking = true;
                }
            }

            window.addEventListener('scroll', onScroll, { passive: true });
            window.addEventListener('resize', function() {
                updateCardScales();
            }, { passive: true });

            if (document.readyState === 'complete') {
                updateCardScales();
            } else {
                window.addEventListener('load', function() {
                    updateCardScales();
                });
            }

            // ================================================================
            //  8. 模糊覆盖层
            // ================================================================
            const blurOverlay = document.getElementById('blurOverlay');
            const heroSection = document.querySelector('.hero-section');

            function updateBlurOverlay() {
                const scrollY = window.scrollY;
                const windowHeight = window.innerHeight;
                const heroHeight = heroSection ? heroSection.offsetHeight : windowHeight;

                const startY = heroHeight * 0.01;
                const endY = heroHeight * 0.80;

                let progress = 0;
                if (scrollY > startY) {
                    progress = Math.min((scrollY - startY) / (endY - startY), 1);
                }
                const easedProgress = Math.pow(progress, 0.6);
                blurOverlay.style.height = (easedProgress * 100) + '%';
            }

            window.addEventListener('scroll', updateBlurOverlay, { passive: true });
            window.addEventListener('resize', updateBlurOverlay, { passive: true });
            setTimeout(updateBlurOverlay, 200);

            // ================================================================
            //  9. Dock 栏 — 滚动到底部时显示
            // ================================================================
            let dockVisible = false;

            function checkDockVisibility() {
                const scrollY = window.scrollY;
                const windowHeight = window.innerHeight;
                const documentHeight = document.documentElement.scrollHeight;
                const isAtBottom = scrollY + windowHeight >= documentHeight - 20;

                if (isAtBottom && !dockVisible) {
                    dockVisible = true;
                    dockBar.classList.add('visible');
                } else if (!isAtBottom && dockVisible) {
                    dockVisible = false;
                    dockBar.classList.remove('visible');
                }
            }

            window.addEventListener('scroll', checkDockVisibility, { passive: true });
            window.addEventListener('resize', function() {
                clearTimeout(window._dockResizeTimer);
                window._dockResizeTimer = setTimeout(checkDockVisibility, 200);
            }, { passive: true });

            if (document.readyState === 'complete') {
                setTimeout(checkDockVisibility, 300);
            } else {
                window.addEventListener('load', function() {
                    setTimeout(checkDockVisibility, 500);
                });
            }

            // ================================================================
            //  10. Dock 栏「首页」按钮
            // ================================================================
            dockHomeBtn.addEventListener('click', function(e) {
                e.preventDefault();
                this.style.transform = 'scale(0.94)';
                setTimeout(() => { this.style.transform = ''; }, 150);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            // ================================================================
            //  11. 自适应字体大小
            // ================================================================
            function adjustFontSize() {
                const allCards = document.querySelectorAll('.card');
                allCards.forEach(function(card) {
                    const title = card.querySelector('.card-title');
                    const body = card.querySelector('.card-body');
                    if (title) {
                        let fontSize = parseFloat(window.getComputedStyle(title).fontSize);
                        const maxWidth = card.offsetWidth - 40;
                        const image = card.querySelector('.card-image');
                        let imageWidth = 0;
                        if (image) {
                            const style = window.getComputedStyle(image);
                            const marginLeft = parseFloat(style.marginLeft) || 0;
                            imageWidth = image.offsetWidth + marginLeft;
                        }
                        const availableWidth = maxWidth - imageWidth - 40;
                        if (availableWidth <= 0) return;
                        let tempSpan = document.createElement('span');
                        tempSpan.style.whiteSpace = 'nowrap';
                        tempSpan.style.fontSize = fontSize + 'px';
                        tempSpan.style.fontWeight = '800';
                        tempSpan.style.visibility = 'hidden';
                        tempSpan.textContent = title.textContent;
                        document.body.appendChild(tempSpan);
                        let textWidth = tempSpan.offsetWidth;
                        document.body.removeChild(tempSpan);
                        if (textWidth > availableWidth) {
                            let newSize = fontSize * (availableWidth / textWidth);
                            newSize = Math.max(newSize, 16);
                            title.style.fontSize = newSize + 'px';
                        } else {
                            if (!title.dataset.defaultSize) {
                                title.dataset.defaultSize = getComputedStyle(title).fontSize;
                            }
                            const defaultSize = parseFloat(title.dataset.defaultSize);
                            if (parseFloat(title.style.fontSize) < defaultSize && textWidth < availableWidth * 0.9) {
                                title.style.fontSize = defaultSize + 'px';
                            }
                        }
                    }
                    if (body) {
                        let fontSize = parseFloat(window.getComputedStyle(body).fontSize);
                        const maxWidth = card.offsetWidth - 40;
                        const image = card.querySelector('.card-image');
                        let imageWidth = 0;
                        if (image) {
                            const style = window.getComputedStyle(image);
                            const marginLeft = parseFloat(style.marginLeft) || 0;
                            imageWidth = image.offsetWidth + marginLeft;
                        }
                        const availableWidth = maxWidth - imageWidth - 40;
                        if (availableWidth <= 0) return;
                        let tempSpan = document.createElement('span');
                        tempSpan.style.whiteSpace = 'nowrap';
                        tempSpan.style.fontSize = fontSize + 'px';
                        tempSpan.style.fontWeight = '300';
                        tempSpan.style.visibility = 'hidden';
                        tempSpan.textContent = body.textContent;
                        document.body.appendChild(tempSpan);
                        let textWidth = tempSpan.offsetWidth;
                        document.body.removeChild(tempSpan);
                        if (textWidth > availableWidth) {
                            let newSize = fontSize * (availableWidth / textWidth);
                            newSize = Math.max(newSize, 12);
                            body.style.fontSize = newSize + 'px';
                        } else {
                            if (!body.dataset.defaultSize) {
                                body.dataset.defaultSize = getComputedStyle(body).fontSize;
                            }
                            const defaultSize = parseFloat(body.dataset.defaultSize);
                            if (parseFloat(body.style.fontSize) < defaultSize && textWidth < availableWidth * 0.9) {
                                body.style.fontSize = defaultSize + 'px';
                            }
                        }
                    }
                });
            }

            window.addEventListener('load', function() {
                document.querySelectorAll('.card-title').forEach(function(el) {
                    if (!el.dataset.defaultSize) {
                        el.dataset.defaultSize = getComputedStyle(el).fontSize;
                    }
                });
                document.querySelectorAll('.card-body').forEach(function(el) {
                    if (!el.dataset.defaultSize) {
                        el.dataset.defaultSize = getComputedStyle(el).fontSize;
                    }
                });
                adjustFontSize();
            });

            let resizeTimeout;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(adjustFontSize, 100);
            });
            window.addEventListener('orientationchange', function() {
                setTimeout(adjustFontSize, 300);
            });

            // ================================================================
            //  12. 设备检测
            // ================================================================
            function detectDevice() {
                const ua = navigator.userAgent;
                const isPhone = /Mobi|Android|iPhone|iPod/i.test(ua) && !/iPad/i.test(ua);

                if (isPhone) {
                    document.body.style.backgroundImage = "url('img4.jpg')";
                }

                const indicator = document.getElementById('deviceIndicator');
                if (isPhone) {
                    indicator.textContent = '📱 手机';
                } else {
                    indicator.textContent = '💻 电脑';
                }
            }

            if (document.readyState === 'complete') {
                detectDevice();
            } else {
                window.addEventListener('load', detectDevice);
            }

            // ================================================================
            //  13. 全屏卡片入场动画 + 背景切换
            // ================================================================
            function triggerFullpageAnimation() {
                const rect = fullpageSection.getBoundingClientRect();
                const windowHeight = window.innerHeight;
                const isVisible = rect.top < windowHeight - 50 && rect.bottom > 50;

                if (isVisible) {
                    fullpageLeft.classList.add('visible');
                    fullpageRight.classList.add('visible');
                    // 切换背景到 img5.jpg
                    document.body.classList.add('bg-img5');
                } else {
                    fullpageLeft.classList.remove('visible');
                    fullpageRight.classList.remove('visible');
                    // 移除背景切换
                    document.body.classList.remove('bg-img5');
                }
            }

            window.addEventListener('scroll', triggerFullpageAnimation, { passive: true });
            window.addEventListener('resize', triggerFullpageAnimation, { passive: true });

            if (document.readyState === 'complete') {
                setTimeout(triggerFullpageAnimation, 300);
            } else {
                window.addEventListener('load', function() {
                    setTimeout(triggerFullpageAnimation, 500);
                });
            }

        })();
    </script>

</body>
