<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>chen_space</title>
    <style>
        /* ===== 全局重置 & 基础 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            color: white;
            overflow-x: hidden;
            background-color: #1a1a2e;
            background-image: url('img.jpg');
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            transition: background 0.8s ease, background-color 0.8s ease;
        }

        body.dark-mode {
            background-image: none !important;
            background-color: #000000 !important;
        }

        body.bg-img5 {
            background-image: url('img5.jpg') !important;
        }

        body.bg-img6 {
            background-image: url('img6.jpg') !important;
        }

        body.dark-mode.bg-img5,
        body.dark-mode.bg-img6 {
            background-image: none !important;
            background-color: #000000 !important;
        }

        /* ===== 模糊覆盖层 ===== */
        .blur-overlay {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0;
            background: transparent;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            z-index: 1;
            pointer-events: none;
            transition: height 0.08s ease-out, -webkit-mask-image 0.3s ease;
            transition: height 0.08s ease-out, mask-image 0.3s ease;
            -webkit-mask-image: linear-gradient(to top, black 0%, black 65%, transparent 100%);
            mask-image: linear-gradient(to top, black 0%, black 65%, transparent 100%);
            -webkit-mask-composite: source-over;
            mask-composite: add;
        }

        .blur-overlay.full {
            -webkit-mask-image: none !important;
            mask-image: none !important;
        }

        /* ================================================================
               导航栏
               ================================================================ */
        .navbar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 700px;
            padding: 12px 24px;
            background: rgba(10, 10, 30, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 1000;
            -webkit-mask-image: linear-gradient(to right, transparent 0%, black 2%, black 98%, transparent 100%);
            mask-image: linear-gradient(to right, transparent 0%, black 2%, black 98%, transparent 100%);
            -webkit-mask-size: 0% 100%;
            mask-size: 0% 100%;
            -webkit-mask-position: center;
            mask-position: center;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            opacity: 0;
            animation: navbarExpand 1s cubic-bezier(0.23, 1, 0.32, 1) forwards;
            animation-delay: 0.05s;
            animation-fill-mode: forwards;
        }

        .navbar.mask-done {
            -webkit-mask-image: none !important;
            mask-image: none !important;
        }

        @keyframes navbarExpand {
            0% {
                -webkit-mask-size: 0% 100%;
                mask-size: 0% 100%;
                opacity: 0;
            }
            60% {
                opacity: 1;
            }
            100% {
                -webkit-mask-size: 100% 100%;
                mask-size: 100% 100%;
                opacity: 1;
            }
        }

        @media (min-width: 768px) {
            .navbar {
                width: calc(100% - 48px);
                max-width: 100%;
                padding: 14px 32px;
            }
        }

        @media (min-width: 1024px) {
            .navbar {
                width: calc(100% - 64px);
                max-width: 100%;
                padding: 14px 38px;
            }
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            z-index: 2;
        }

        /* ★★★ 用户状态样式 ★★★ */
        .user-status {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            padding: 4px 12px 4px 8px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s ease;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.85);
            white-space: nowrap;
        }
        .user-status:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.15);
            transform: scale(1.03);
        }
        .user-status i {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.5);
        }
        .user-status .username-text {
            max-width: 80px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        @media (max-width: 480px) {
            .user-status { padding: 3px 8px 3px 6px; font-size: 0.7rem; }
            .user-status .username-text { max-width: 50px; }
        }

        .device-indicator {
            font-size: 0.75rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            white-space: nowrap;
            letter-spacing: 0.3px;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .nav-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 0.8px;
            white-space: nowrap;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .nav-center {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            min-height: 2.2rem;
            padding: 0 8px;
            opacity: 0;
            transform: translateY(-28px);
            animation: slideDownCaillo 1s cubic-bezier(0.23, 1, 0.32, 1) forwards;
            animation-delay: 0.15s;
        }

        @keyframes slideDownCaillo {
            0% {
                opacity: 0;
                transform: translateY(-30px);
            }
            60% {
                opacity: 0.8;
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .nav-text {
            font-size: 1.1rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.75);
            letter-spacing: 1.5px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            white-space: nowrap;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            transition: opacity 0.45s cubic-bezier(0.23, 1, 0.32, 1),
                transform 0.45s cubic-bezier(0.23, 1, 0.32, 1);
            will-change: transform, opacity;
        }

        .nav-text.fade-out {
            opacity: 0;
            transform: translateY(-12px);
        }

        .nav-text.fade-in {
            opacity: 1;
            transform: translateY(0);
        }

        @media (min-width: 768px) {
            .nav-text {
                font-size: 1.3rem;
                letter-spacing: 2px;
            }
        }

        @media (min-width: 1024px) {
            .nav-text {
                font-size: 1.5rem;
                letter-spacing: 2.5px;
            }
        }

        @media (max-width: 600px) {
            .nav-center {
                display: none;
            }
        }

        .nav-buttons {
            display: flex;
            gap: 12px;
            flex-shrink: 0;
            z-index: 2;
        }

        .nav-btn {
            padding: 6px 22px;
            border: none;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            letter-spacing: 0.5px;
            font-family: inherit;
            white-space: nowrap;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: scale(1.04);
            border-color: rgba(255, 255, 255, 0.2);
            color: white;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.08);
        }

        .nav-btn:active {
            transform: scale(0.96);
        }

        @media (max-width: 480px) {
            .nav-btn {
                padding: 4px 14px;
                font-size: 0.75rem;
            }
            .nav-title {
                font-size: 0.9rem;
            }
            .device-indicator {
                font-size: 0.6rem;
                padding: 1px 8px;
            }
        }

        @media (max-width: 380px) {
            .nav-btn {
                padding: 3px 10px;
                font-size: 0.65rem;
            }
            .nav-title {
                font-size: 0.75rem;
            }
            .device-indicator {
                font-size: 0.5rem;
                padding: 1px 6px;
            }
        }

        /* ================================================================
               通知系统 — 滑入动画 + 跑马灯 + 自适应宽度
               ================================================================ */
        .notification-container {
            position: fixed;
            right: 20px;
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            pointer-events: none;
            max-width: 90vw;
        }

        .notification-item {
            padding: 3px;
            border-radius: 18px;
            background-size: 300% 300%;
            animation: borderRotate 3s linear infinite;
            overflow: hidden;
            max-height: 120px;
            opacity: 0;
            transform: translateX(calc(100% + 30px));
            transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1),
                opacity 0.4s ease,
                max-height 0.5s cubic-bezier(0.23, 1, 0.32, 1),
                margin 0.4s ease,
                padding 0.4s ease;
            will-change: transform, max-height, opacity;
            transform-origin: top center;
            width: auto;
            max-width: 90vw;
            flex-shrink: 0;
        }

        .notification-item.show {
            opacity: 1;
            transform: translateX(0);
        }

        .notification-item.removing {
            transform: translateX(calc(100% + 30px));
            opacity: 0;
            max-height: 0;
            margin: 0;
            padding: 0;
            pointer-events: none;
            overflow: hidden;
        }

        @keyframes borderRotate {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 300% 50%;
            }
        }

        .notification-inner {
            background: rgba(60, 60, 85, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 16px 30px;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: 0.6px;
            white-space: nowrap;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
        }

        @media (max-width: 768px) {
            .notification-container {
                right: 12px;
                max-width: 85vw;
            }
            .notification-inner {
                font-size: 0.9rem;
                padding: 12px 20px;
                border-radius: 13px;
            }
            .notification-item {
                border-radius: 15px;
                padding: 2.5px;
                max-height: 100px;
                max-width: 85vw;
            }
        }

        @media (max-width: 480px) {
            .notification-container {
                right: 8px;
                gap: 6px;
                max-width: 80vw;
            }
            .notification-inner {
                font-size: 0.78rem;
                padding: 10px 16px;
                border-radius: 11px;
                white-space: normal;
            }
            .notification-item {
                border-radius: 12px;
                padding: 2px;
                max-height: 120px;
                max-width: 80vw;
            }
        }

        @media (max-width: 380px) {
            .notification-inner {
                font-size: 0.7rem;
                padding: 8px 12px;
            }
            .notification-item {
                max-height: 100px;
                max-width: 80vw;
            }
        }

        /* ===== 主布局 ===== */
        .main-wrapper {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 20px 100px;
        }

        .hero-section {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding-top: 40px;
        }

        .content {
            max-width: 80vw;
            padding: 1.8rem 2.2rem;
            background: rgba(10, 10, 30, 0.3);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
            transition: transform 0.2s ease, background 0.5s ease, border-color 0.5s ease;
            opacity: 0;
            transform: translateY(50px);
            animation: fadeUp 1s cubic-bezier(0.23, 1, 0.32, 1) forwards;
            animation-delay: 0.1s;
            margin-top: 60px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        body.dark-mode .content {
            background: rgba(0, 0, 0, 0.7);
            border-color: rgba(255, 0, 0, 0.3);
        }

        body.dark-mode .card {
            border-color: rgba(255, 255, 255, 0.15);
        }

        .content:hover {
            transform: scale(1.01);
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(50px);
                text-shadow: 0 0 0 rgba(255, 255, 255, 0);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
                text-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
            }
        }

        .dynamic-text {
            font-size: clamp(2.8rem, 8vw, 5rem);
            font-weight: 700;
            letter-spacing: 0.03em;
            color: white;
            text-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            line-height: 1.2;
            min-height: 1.4em;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            position: relative;
            transition: color 0.4s ease;
        }

        .dynamic-text.red-mode {
            color: #ff1744 !important;
            text-shadow: 0 0 40px rgba(255, 23, 68, 0.4);
        }

        .dynamic-text::after {
            content: '|';
            display: inline-block;
            margin-left: 2px;
            font-weight: 300;
            opacity: 0.7;
            animation: blinkCursor 0.9s step-end infinite;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9em;
            transition: color 0.4s ease;
        }

        .dynamic-text.red-mode::after {
            color: #ff1744;
        }

        .dynamic-text.no-cursor::after {
            content: none;
            animation: none;
            opacity: 0;
        }

        @keyframes blinkCursor {
            0%,
            100% {
                opacity: 0.7;
            }
            50% {
                opacity: 0;
            }
        }

        .btn-glass {
            display: inline-block;
            padding: 14px 48px;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            font-family: inherit;
            user-select: none;
        }

        .btn-glass:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.02);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .btn-glass:active {
            transform: scale(0.97);
        }

        body.dark-mode .btn-glass {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.08);
        }

        body.dark-mode .btn-glass:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        /* ===== 卡片区域 ===== */
        .cards-section {
            width: 100%;
            max-width: 960px;
            margin-top: 40px;
            padding-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 80px;
            flex-shrink: 0;
            opacity: 1;
            transform: none;
        }

        .card {
            --scale: 1;
            transform: scale(var(--scale)) translateY(0);
            transform-origin: center center;
            will-change: transform;

            background: rgba(20, 20, 40, 0.35);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 5px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);

            border-radius: 24px;
            padding: 40px 35px;
            height: 280px;
            transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                box-shadow 0.25s ease,
                border-color 0.5s ease,
                background 0.3s ease;
            width: 100%;
            display: flex;
            flex-direction: row;
            align-items: stretch;
            justify-content: space-between;
            cursor: pointer;
            overflow: hidden;
        }

        .card:hover {
            transform: scale(calc(var(--scale) * 1.02)) translateY(-4px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            background: rgba(30, 30, 60, 0.45);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .card:active {
            transform: scale(calc(var(--scale) * 0.97)) translateY(0);
        }

        body.dark-mode .card {
            background: rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.1);
        }

        body.dark-mode .card:hover {
            background: rgba(0, 0, 0, 0.6);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .card-content {
            display: flex;
            flex-direction: column;
            flex: 1 1 auto;
            min-width: 0;
            pointer-events: none;
            overflow: hidden;
            justify-content: flex-start;
            align-items: flex-start;
        }

        .card-title {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            color: #ffffff;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .card-body {
            font-size: 1.15rem;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 300;
            letter-spacing: 0.3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
        }

        .card-image {
            flex-shrink: 0;
            margin-left: 25px;
            max-width: 140px;
            max-height: 160px;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }

        .card-image img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        .card-emoji {
            font-size: 110px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: auto;
            text-align: center;
            user-select: none;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.3));
        }

        /* ===== 全屏卡片页（第二页） ===== */
        .fullpage-section {
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 40px 80px;
        }

        .fullpage-inner {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: stretch;
        }

        .fullpage-left {
            display: flex;
            flex-direction: column;
            gap: 40px;
            opacity: 0;
            transform: translateX(-220px);
            transition: opacity 1.5s cubic-bezier(0.23, 1, 0.32, 1),
                transform 1.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .fullpage-left.visible {
            opacity: 1;
            transform: translateX(0);
        }

        .fullpage-right {
            display: flex;
            opacity: 0;
            transform: translateX(220px);
            transition: opacity 1.5s cubic-bezier(0.23, 1, 0.32, 1),
                transform 1.5s cubic-bezier(0.23, 1, 0.32, 1);
            transition-delay: 0.15s;
        }

        .fullpage-right.visible {
            opacity: 1;
            transform: translateX(0);
        }

        .fullpage-card {
            background: rgba(20, 20, 40, 0.35);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 5px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border-radius: 28px;
            padding: 45px 40px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            width: 100%;
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.3s ease;
            overflow: hidden;
            flex: 1;
            min-height: 280px;
        }

        .fullpage-card:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
            background: rgba(30, 30, 60, 0.45);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .fullpage-card:active {
            transform: scale(0.97);
        }

        body.dark-mode .fullpage-card {
            background: rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.1);
        }

        body.dark-mode .fullpage-card:hover {
            background: rgba(0, 0, 0, 0.6);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .fullpage-card .card-title {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
            color: #ffffff;
            line-height: 1.2;
            white-space: normal;
            overflow: visible;
            text-overflow: unset;

            // 打字机动画
            const textEl = document.getElementById('typingText');
            const words = ['welcome', '你好', '欢迎来到我的空间', '无限进步'];
            let currentIndex = 0;
            let currentText = words[currentIndex];
            let displayText = '';
            let pos = 0;
            let timer = null;
            let isWaiting = false;
            let waitStartTime = 0;
            const WAIT_DURATION = 3000;
            const CHAR_INTERVAL = 70;
            let lastCharTime = 0;
            let mode = 'typing';
            let isStopped = false;

            function clearTimer() {
                if (timer) {
                    cancelAnimationFrame(timer);
                    timer = null;
                }
            }

            function updateDisplay() {
                textEl.textContent = displayText;
            }

            function switchToNextWord() {
                if (isStopped) return;
                currentIndex = (currentIndex + 1) % words.length;
                currentText = words[currentIndex];
                displayText = '';
                pos = 0;
                mode = 'typing';
                isWaiting = false;
                lastCharTime = performance.now();
                updateDisplay();
                step(performance.now());
            }

            function step(timestamp) {
                if (isStopped) return;
                if (!timestamp) timestamp = performance.now();

                if (isWaiting) {
                    if (timestamp - waitStartTime >= WAIT_DURATION) {
                        isWaiting = false;
                        mode = 'deleting';
                        lastCharTime = timestamp;
                        timer = requestAnimationFrame(step);
                    } else {
                        timer = requestAnimationFrame(step);
                    }
                    return;
                }

                if (mode === 'typing') {
                    if (timestamp - lastCharTime >= CHAR_INTERVAL) {
                        if (pos < currentText.length) {
                            pos++;
                            displayText = currentText.substring(0, pos);
                            updateDisplay();
                            lastCharTime = timestamp;
                            if (pos === currentText.length) {
                                isWaiting = true;
                                waitStartTime = timestamp;
                                timer = requestAnimationFrame(step);
                                return;
                            }
                        }
                    }
                    timer = requestAnimationFrame(step);
                } else if (mode === 'deleting') {
                    if (timestamp - lastCharTime >= CHAR_INTERVAL) {
                        if (pos > 0) {
                            pos--;
                            displayText = currentText.substring(0, pos);
                            updateDisplay();
                            lastCharTime = timestamp;
                            if (pos === 0) {
                                switchToNextWord();
                                return;
                            }
                        }
                    }
                    timer = requestAnimationFrame(step);
                }
            }

            function startAnimation() {
                clearTimer();
                isStopped = false;
                displayText = '';
                pos = 0;
                currentIndex = 0;
                currentText = words[currentIndex];
                mode = 'typing';
                isWaiting = false;
                lastCharTime = performance.now();
                updateDisplay();
                textEl.classList.remove('no-cursor');
                textEl.classList.remove('red-mode');
                step(performance.now());
            }

            function stopTypingAndSetText(fixedText, isRed) {
                clearTimer();
                isStopped = true;
                textEl.textContent = fixedText;
                if (isRed) {
                    textEl.classList.add('red-mode');
                } else {
                    textEl.classList.remove('red-mode');
                }
                textEl.classList.add('no-cursor');
            }

            function resumeTyping() {
                clearTimer();
                isStopped = false;
                textEl.classList.remove('red-mode');
                textEl.classList.remove('no-cursor');
                displayText = '';
                pos = 0;
                currentIndex = 0;
                currentText = words[currentIndex];
                mode = 'typing';
                isWaiting = false;
                lastCharTime = performance.now();

            // 滚动缩放卡片
            const MIN_SCALE = 0.30;
            const NORMAL_SCALE = 1.0;
            const THRESHOLD_TOP = 0.70;
            const THRESHOLD_BOTTOM = 1.00;

            function updateCardScales() {
                const windowHeight = window.innerHeight;
                const thresholdTopPx = windowHeight * THRESHOLD_TOP;
                const thresholdBottomPx = windowHeight * THRESHOLD_BOTTOM;
                const range = thresholdBottomPx - thresholdTopPx;

                cards.forEach(function(card) {
                    const rect = card.getBoundingClientRect();
                    const top = rect.top;

                    let scale = NORMAL_SCALE;

                    if (top <= thresholdTopPx) {
                        scale = NORMAL_SCALE;
                    } else if (top >= thresholdBottomPx) {
                        scale = MIN_SCALE;
                    } else {
                        const progress = (top - thresholdTopPx) / range;
                        scale = NORMAL_SCALE - (NORMAL_SCALE - MIN_SCALE) * progress;
                    }

                    card.style.setProperty('--scale', scale);
                });
            }

            let ticking = false;

            function onScroll() {
                if (!ticking) {
                    window.requestAnimationFrame(function() {
                        updateCardScales();
                        ticking = false;
                    });
                    ticking = true;
                }
            }

            window.addEventListener('scroll', onScroll, { passive: true });
            window.addEventListener('resize', function() {
                updateCardScales();
            }, { passive: true });

            if (document.readyState === 'complete') {
                updateCardScales();
            } else {

                const startY = heroHeight * 0.01;
                const endY = heroHeight * 0.80;

                let progress = 0;
                if (scrollY > startY) {
                    progress = Math.min((scrollY - startY) / (endY - startY), 1);
                }
                const easedProgress = Math.pow(progress, 0.6);
                const glassHeight = easedProgress * 100;

                blurOverlay.style.height = glassHeight + '%';

                if (glassHeight > 95) {
                    blurOverlay.classList.add('full');
                } else {
                    blurOverlay.classList.remove('full');
                }
            }

                            const style = window.getComputedStyle(image);
                            const marginLeft = parseFloat(style.marginLeft) || 0;
                            imageWidth = image.offsetWidth + marginLeft;
                        }
                        const availableWidth = maxWidth - imageWidth - 40;
                        if (availableWidth <= 0) return;
                        let tempSpan = document.createElement('span');
                        tempSpan.style.whiteSpace = 'nowrap';
                        tempSpan.style.fontSize = fontSize + 'px';
                        tempSpan.style.fontWeight = '800';
                        tempSpan.style.visibility = 'hidden';
                        tempSpan.textContent = title.textContent;
                        document.body.appendChild(tempSpan);
                        let textWidth = tempSpan.offsetWidth;
                        document.body.removeChild(tempSpan);
                        if (textWidth > availableWidth) {
                            let newSize = fontSize * (availableWidth / textWidth);
                            newSize = Math.max(newSize, 16);
                            title.style.fontSize = newSize + 'px';
                        } else {
                            if (!title.dataset.defaultSize) {
                                title.dataset.defaultSize = getComputedStyle(title).fontSize;
                            }
                            const defaultSize = parseFloat(title.dataset.defaultSize);
                            if (parseFloat(title.style.fontSize) < defaultSize && textWidth < availableWidth * 0.9) {
                                title.style.fontSize = defaultSize + 'px';
                            }
                        }
                    }
                    if (body) {
                        let fontSize = parseFloat(window.getComputedStyle(body).fontSize);
                        const maxWidth = card.offsetWidth - 40;
                        const image = card.querySelector('.card-image');
                        let imageWidth = 0;
                        if (image) {
                            const style = window.getComputedStyle(image);
                            const marginLeft = parseFloat(style.marginLeft) || 0;
                            imageWidth = image.offsetWidth + marginLeft;
                        }
                        const availableWidth = maxWidth - imageWidth - 40;
                        if (availableWidth <= 0) return;
                        let tempSpan = document.createElement('span');
                        tempSpan.style.whiteSpace = 'nowrap';
                        tempSpan.style.fontSize = fontSize + 'px';
                        tempSpan.style.fontWeight = '300';
                        tempSpan.style.visibility = 'hidden';
                        tempSpan.textContent = body.textContent;
                        document.body.appendChild(tempSpan);
                        let textWidth = tempSpan.offsetWidth;
                        document.body.removeChild(tempSpan);
                        if (textWidth > availableWidth) {
                            let newSize = fontSize * (availableWidth / textWidth);
                            newSize = Math.max(newSize, 12);
                            body.style.fontSize = newSize + 'px';
                        } else {
                            if (!body.dataset.defaultSize) {
                                body.dataset.defaultSize = getComputedStyle(body).fontSize;
                            }
                            const defaultSize = parseFloat(body.dataset.defaultSize);
                            if (parseFloat(body.style.fontSize) < defaultSize && textWidth < availableWidth * 0.9) {
                                body.style.fontSize = defaultSize + 'px';
                            }
                        }
                    }
                });
            }

            window.addEventListener('load', function() {
                document.querySelectorAll('.card-title').forEach(function(el) {
                    if (!el.dataset.defaultSize) {
                        el.dataset.defaultSize = getComputedStyle(el).fontSize;
                    }
                });
                document.querySelectorAll('.card-body').forEach(function(el) {
                    if (!el.dataset.defaultSize) {
                        el.dataset.defaultSize = getComputedStyle(el).fontSize;
                    }
                });
                adjustFontSize();
            });

            let resizeTimeout;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(adjustFontSize, 100);
            });
            window.addEventListener('orientationchange', function() {
                setTimeout(adjustFontSize, 300);
            });

            // 设备检测
            function detectDevice() {
                const ua = navigator.userAgent;
                const isPhone = /Mobi|Android|iPhone|iPod/i.test(ua) && !/iPad/i.test(ua);

                if (isPhone) {
                    if (!isDarkMode && !bodyEl.classList.contains('bg-img5') && !bodyEl.classList.contains('bg-img6')) {
                        bodyEl.style.backgroundImage = "url('img4.jpg')";
                    }
                }

                const indicator = document.getElementById('deviceIndicator');
                if (isPhone) {
                    indicator.textContent = '📱 手机';
                } else {
                    indicator.textContent = '💻 电脑';
                }
            }

            if (document.readyState === 'complete') {
                detectDevice();
            } else {
                window.addEventListener('load', detectDevice);
            }

            // 背景切换
            let lastBgState = '';

            function updateBackground() {
                const windowHeight = window.innerHeight;
                const rect2 = fullpageSection.getBoundingClientRect();
                const rect3 = fullpageSection3.getBoundingClientRect();

                const isPage2Visible = rect2.top < windowHeight - 50 && rect2.bottom > 50;
                const isPage3Visible = rect3.top < windowHeight - 50 && rect3.bottom > 50;

                let newState = 'default';

                if (isPage3Visible) {
                    newState = 'img6';
                } else if (isPage2Visible) {
                    newState = 'img5';
                } else {
                    newState = 'default';
                }

                if (newState !== lastBgState) {
                    lastBgState = newState;

                    bodyEl.classList.remove('bg-img5', 'bg-img6');

                    if (newState === 'img5') {
                        bodyEl.classList.add('bg-img5');
                    } else if (newState === 'img6') {
                        bodyEl.classList.add('bg-img6');
                    }
                    if (newState === 'default') {
                        const isPhone = /Mobi|Android|iPhone|iPod/i.test(navigator.userAgent) && !/iPad/i.test(
                            navigator.userAgent);
                        if (isPhone && !isDarkMode) {
                            bodyEl.style.backgroundImage = "url('img4.jpg')";
                        } else {
                            bodyEl.style.backgroundImage = "url('img.jpg')";
                        }
                    }
                }
            }

            // 全屏卡片入场动画
            function triggerFullpageAnimation() {
                const rect = fullpageSection.getBoundingClientRect();
                const windowHeight = window.innerHeight;
                const isVisible = rect.top < windowHeight - 50 && rect.bottom > 50;

                if (isVisible) {
                    fullpageLeft.classList.add('visible');
                    fullpageRight.classList.add('visible');
                } else {
                    fullpageLeft.classList.remove('visible');
                    fullpageRight.classList.remove('visible');
                }
            }

            function triggerFullpageAnimation3() {
                const rect = fullpageSection3.getBoundingClientRect();
                const windowHeight = window.innerHeight;
                const isVisible = rect.top < windowHeight - 50 && rect.bottom > 50;

                if (isVisible) {
                    fullpageColLeft3.classList.add('visible');
                    fullpageColRight3.classList.add('visible');
                } else {
                    fullpageColLeft3.classList.remove('visible');
                    fullpageColRight3.classList.remove('visible');
                }
            }

            let scrollTicking2 = false;

            function handleScroll2() {
                if (!scrollTicking2) {
                    window.requestAnimationFrame(function() {
                        updateBackground();
                        triggerFullpageAnimation();
                        triggerFullpageAnimation3();
                        scrollTicking2 = false;
                    });
                    scrollTicking2 = true;
                }
            }

            window.addEventListener('scroll', handleScroll2, { passive: true });
            window.addEventListener('resize', handleScroll2, { passive: true });

            if (document.readyState === 'complete') {
                setTimeout(handleScroll2, 300);
            } else {
                window.addEventListener('load', function() {
                    setTimeout(handleScroll2, 500);
                });
            }

            // 导航栏边缘过渡消除
            function onNavbarExpandEnd() {
                navbarEl.classList.add('mask-done');
            }

            navbarEl.addEventListener('animationend', function(e) {
                if (e.animationName === 'navbarExpand') {
                    onNavbarExpandEnd();
                }
            });

            setTimeout(function() {
                if (!navbarEl.classList.contains('mask-done')) {
                    navbarEl.classList.add('mask-done');
                }
            }, 5000);

            // caillo~ 切换为随机诗句
            let poemSwitched = false;

            function switchToPoem() {
                if (poemSwitched) return;
                poemSwitched = true;

                const randomPoem = poems[Math.floor(Math.random() * poems.length)];

                navTextEl.classList.add('fade-out');

                setTimeout(function() {
                    navTextEl.textContent = randomPoem;

                    const len = randomPoem.length;
                    let fontSize = 1.1;
                    if (len > 20) {
                        fontSize = 0.75;
                    } else if (len > 14) {
                        fontSize = 0.85;
                    } else if (len > 8) {
                        fontSize = 0.95;
                    }
                    const isWide = window.innerWidth >= 768;
                    if (isWide) {
                        fontSize = fontSize * 1.2;
                    }
                    if (window.innerWidth >= 1024) {
                        fontSize = fontSize * 1.3;
                    }
                    fontSize = Math.min(Math.max(fontSize, 0.7), 1.6);
                    navTextEl.style.fontSize = fontSize + 'rem';

                    navTextEl.classList.remove('fade-out');
                    void navTextEl.offsetWidth;
                    navTextEl.classList.add('fade-in');
                }, 450);
            }

            const navCenterEl = document.querySelector('.nav-center');
            if (navCenterEl) {
                navCenterEl.addEventListener('animationend', function(e) {
                    if (e.animationName === 'slideDownCaillo') {
                        setTimeout(switchToPoem, 3000);
                    }
                });
            }

            setTimeout(function() {
                if (!poemSwitched) {
                    switchToPoem();
                }
            }, 5500);

            // 通知容器位置自适应
            function updateNotifPosition() {
                const nav = document.getElementById('navbar');
                const container = document.getElementById('notificationContainer');
                if (nav && container) {
                    const navRect = nav.getBoundingClientRect();
                    container.style.top = (navRect.bottom + 24) + 'px';
                }
            }

            window.addEventListener('resize', updateNotifPosition);
            window.addEventListener('load', function() {
                setTimeout(updateNotifPosition, 300);
            });

            // 初始化
            function init() {
                console.log('🚀 初始化页面...');
                setTimeout(initWelcomeNotifications, 800);
                bindAllCardEvents();
                bindCircleButton();
                console.log('✅ 初始化完成');
            }

            if (document.readyState === 'complete') {
                init();
            } else {
                window.addEventListener('load', init);
            }

        })();

        // ★★★ 在页面加载完成后更新用户状态 ★★★
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            setTimeout(updateUserStatus, 300);
        } else {
            document.addEventListener('DOMContentLoaded', function() {
                setTimeout(updateUserStatus, 300);
            });
        }
    </script>

</body>
</html>
