<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>后台调试 · index3</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #0d0d1a;
            color: #e0e0e0;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 1100px;
            width: 100%;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 4px;
            color: #fff;
        }
        .sub {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 24px;
            border-bottom: 1px solid #2a2a3a;
            padding-bottom: 14px;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
        }

        .btn {
            padding: 10px 22px;
            border: none;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #2a2a3e;
            color: #ccc;
            border: 1px solid #3a3a4e;
            font-family: inherit;
        }
        .btn:hover {
            background: #3a3a52;
            transform: scale(1.02);
        }
        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary { background: #4a6cf7; color: #fff; border-color: #4a6cf7; }
        .btn-primary:hover { background: #5a7cff; border-color: #5a7cff; }

        .btn-success { background: #2ecc71; color: #fff; border-color: #2ecc71; }
        .btn-success:hover { background: #3ddc84; border-color: #3ddc84; }

        .btn-warning { background: #f39c12; color: #fff; border-color: #f39c12; }
        .btn-warning:hover { background: #f5b041; border-color: #f5b041; }

        .btn-danger { background: #e74c3c; color: #fff; border-color: #e74c3c; }
        .btn-danger:hover { background: #ff5e4a; border-color: #ff5e4a; }

        .btn-purple { background: #8e44ad; color: #fff; border-color: #8e44ad; }
        .btn-purple:hover { background: #a569bd; border-color: #a569bd; }

        .btn-teal { background: #1abc9c; color: #fff; border-color: #1abc9c; }
        .btn-teal:hover { background: #48c9b0; border-color: #48c9b0; }

        .btn-pink { background: #e84393; color: #fff; border-color: #e84393; }
        .btn-pink:hover { background: #fd79a8; border-color: #fd79a8; }

        .btn-outline { background: transparent; border-color: #4a6cf7; color: #4a6cf7; }
        .btn-outline:hover { background: #4a6cf7; color: #fff; }

        .panel {
            background: #141425;
            border-radius: 16px;
            border: 1px solid #2a2a3e;
            padding: 20px 24px;
            margin-bottom: 24px;
        }

        .panel-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 12px;
        }

        .preview-area {
            min-height: 220px;
            border-radius: 12px;
            background: #0a0a16;
            border: 2px dashed #2a2a3e;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 12px;
            background-size: cover;
            background-position: center center;
            transition: background-image 0.5s ease;
        }
        .preview-area.has-image {
            border-color: #2ecc71;
            border-style: solid;
        }
        .preview-area.has-error {
            border-color: #e74c3c;
            border-style: solid;
        }

        .preview-placeholder {
            color: #555;
            font-size: 0.9rem;
            text-align: center;
            padding: 20px;
        }
        .preview-placeholder span {
            display: block;
            font-size: 2.5rem;
            margin-bottom: 8px;
        }

        .log-area {
            background: #0a0a16;
            border-radius: 10px;
            padding: 14px 16px;
            max-height: 480px;
            overflow-y: auto;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 0.78rem;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-all;
            color: #b0b0c0;
        }
        .log-area .log-entry {
            padding: 2px 0;
            border-bottom: 1px solid #1a1a2e;
        }
        .log-area .log-entry:last-child {
            border-bottom: none;
        }

        .log-area .time {
            color: #555;
            margin-right: 10px;
        }
        .log-area .info { color: #6ab0f7; }
        .log-area .success { color: #2ecc71; }
        .log-area .error { color: #e74c3c; }
        .log-area .warn { color: #f39c12; }
        .log-area .data { color: #d4a0ff; }
        .log-area .url { color: #5dade2; }
        .log-area .status-code { color: #f7dc6f; }

        .status-badge {
            display: inline-block;
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-left: 10px;
        }
        .status-badge.loading { background: #f39c12; color: #1a1a2e; }
        .status-badge.success { background: #2ecc71; color: #0a0a16; }
        .status-badge.fail { background: #e74c3c; color: #fff; }
        .status-badge.idle { background: #2a2a3e; color: #888; }

        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .clear-log {
            background: none;
            border: none;
            color: #555;
            cursor: pointer;
            font-size: 0.75rem;
            padding: 4px 12px;
            border-radius: 20px;
            transition: all 0.2s;
        }
        .clear-log:hover {
            background: #2a2a3e;
            color: #ccc;
        }

        .log-area::-webkit-scrollbar {
            width: 4px;
        }
        .log-area::-webkit-scrollbar-track {
            background: transparent;
        }
        .log-area::-webkit-scrollbar-thumb {
            background: #3a3a52;
            border-radius: 10px;
        }

        .api-desc {
            font-size: 0.8rem;
            color: #666;
            margin-top: 2px;
        }

        .custom-url-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            margin-top: 6px;
        }
        .custom-url-row input {
            flex: 1;
            padding: 8px 14px;
            border-radius: 30px;
            border: 1px solid #3a3a4e;
            background: #0a0a16;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
            min-width: 200px;
        }
        .custom-url-row input:focus {
            border-color: #4a6cf7;
        }
        .custom-url-row input::placeholder {
            color: #555;
        }

        /* ★★★ 用户数据表格 ★★★ */
        .user-table-wrap {
            overflow-x: auto;
            margin-top: 8px;
        }
        .user-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        .user-table th {
            text-align: left;
            padding: 8px 12px;
            background: rgba(255,255,255,0.04);
            color: #888;
            font-weight: 600;
            border-bottom: 1px solid #2a2a3e;
        }
        .user-table td {
            padding: 8px 12px;
            border-bottom: 1px solid #1a1a2e;
            color: #ccc;
        }
        .user-table tr:hover td {
            background: rgba(255,255,255,0.02);
        }
        .user-table .online-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .user-table .online-dot.online {
            background: #2ecc71;
        }
        .user-table .online-dot.offline {
            background: #555;
        }

        .online-count-badge {
            background: rgba(46, 204, 113, 0.15);
            color: #2ecc71;
            padding: 2px 14px;
            border-radius: 30px;
            font-size: 0.8rem;
            border: 1px solid rgba(46,204,113,0.2);
        }

        /* 登录弹窗 */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 22, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }

        .login-modal {
            background: linear-gradient(145deg, #1a1a2e, #0d0d1a);
            border-radius: 20px;
            padding: 36px 40px;
            width: 340px;
            max-width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            border: 1px solid #2a2a3e;
            text-align: center;
            color: #e0e0e0;
        }

        .login-modal h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #fff;
            letter-spacing: 1px;
        }

        .login-modal .subtitle {
            font-size: 0.8rem;
            color: #777;
            margin-bottom: 24px;
        }

        .login-modal input {
            width: 100%;
            padding: 12px 16px;
            margin: 8px 0;
            border-radius: 12px;
            border: 1px solid #3a3a4e;
            background: #0a0a16;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .login-modal input:focus {
            border-color: #4a6cf7;
        }

        .login-modal input::placeholder {
            color: #555;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(135deg, #4a6cf7, #5a7cff);
            color: #fff;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 2px;
        }

        .login-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(74, 108, 247, 0.4);
        }

        .login-btn:active {
            transform: scale(0.97);
        }

        .login-msg {
            margin-top: 14px;
            font-size: 0.8rem;
            color: #e74c3c;
            min-height: 1.2em;
            font-weight: 500;
        }

        .login-overlay.fade-out {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        @media (max-width: 600px) {
            .btn-group .btn {
                flex: 1 1 calc(50% - 6px);
                text-align: center;
                font-size: 0.75rem;
                padding: 8px 12px;
            }
            .panel {
                padding: 14px 16px;
            }
            .log-area {
                font-size: 0.68rem;
                max-height: 320px;
            }
            .preview-area {
                min-height: 160px;
            }
            .login-modal {
                padding: 28px 24px;
                width: 300px;
            }
            .custom-url-row {
                flex-direction: column;
                align-items: stretch;
            }
            .custom-url-row input {
                min-width: auto;
            }
            .user-table th, .user-table td {
                padding: 6px 8px;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 壁纸 API 调试台 + 后端监控</h1>
        <div class="sub">
            index3 · 支持自定义 URL · 延迟检测 · 日志导出 · 管理员后台
        </div>

        <!-- ===== 按钮区 ===== -->
        <div class="btn-group">
            <button class="btn btn-primary" id="testPicsum">📸 picsum.photos</button>
            <button class="btn btn-success" id="testUnsplash">🌄 unsplash</button>
            <button class="btn btn-warning" id="testBtstu">🖼️ btstu.cn</button>
            <button class="btn btn-danger" id="testXjh">🎨 img.xjh.me</button>
            <button class="btn btn-purple" id="testLoli">🌸 loli API</button>
            <button class="btn btn-teal" id="testLoremFlickr">📷 loremflickr</button>
            <button class="btn btn-pink" id="testWaifu">🌸 waifu.pics</button>
            <button class="btn btn-outline" id="testBing">🌅 Bing每日</button>
            <button class="btn" id="testAll">🔄 全部测试</button>
            <button class="btn btn-danger" id="clearBtn">🗑️ 清空</button>
        </div>

        <!-- ===== 高级工具 ===== -->
        <div class="btn-group" style="border-top: 1px solid #2a2a3a; padding-top: 12px;">
            <button class="btn btn-outline" id="testDelay">⏱️ 延迟检测</button>
            <button class="btn btn-outline" id="exportLog">💾 导出日志</button>
            <button class="btn btn-outline" id="clearLogBtn">🧹 清日志</button>
        </div>

        <!-- ===== 自定义 URL ===== -->
        <div class="panel" style="padding: 16px 20px;">
            <div class="custom-url-row">
                <input type="text" id="customUrlInput" placeholder="输入图片 URL，例如 https://example.com/image.jpg" />
                <button class="btn btn-primary" id="testCustomUrl">🚀 加载</button>
            </div>
        </div>

        <!-- ===== 预览区 ===== -->
        <div class="panel">
            <div class="flex-between">
                <span class="panel-title">🖼️ 图片预览</span>
                <span class="status-badge idle" id="statusBadge">等待测试</span>
            </div>
            <div class="preview-area" id="previewArea">
                <div class="preview-placeholder" id="placeholder">
                    <span>🖼️</span>
                    点击上方按钮测试 API<br/>
                    成功加载的图片会显示在这里
                </div>
            </div>
            <div style="margin-top:10px;font-size:0.75rem;color:#555;" id="imageInfo"></div>
        </div>

        <!-- ===== ★★★ 后端平台测试面板 ★★★ ===== -->
        <div class="panel" id="userPanel" style="display:none;">
            <div class="flex-between">
                <span class="panel-title">👥 后端平台测试</span>
                <span class="online-count-badge" id="onlineCountBadge">🟢 在线: <span id="onlineCount">0</span> 人</span>
            </div>
            <div class="user-table-wrap">
                <table class="user-table" id="userTable">
                    <thead>
                        <tr>
                            <th>用户名</th>
                            <th>邮箱</th>
                            <th>登录次数</th>
                            <th>最后上线</th>
                            <th>状态</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <tr><td colspan="5" style="text-align:center;color:#555;">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
            <div style="margin-top:12px;font-size:0.75rem;color:#555;">
                <i class="fas fa-sync-alt" style="margin-right:6px;"></i>数据实时更新
                <button class="btn btn-outline" id="refreshUsersBtn" style="margin-left:12px;padding:4px 16px;font-size:0.7rem;">🔄 刷新</button>
            </div>
        </div>

        <!-- ===== 日志区 ===== -->
        <div class="panel">
            <div class="flex-between">
                <span class="panel-title">📋 控制台日志</span>
                <button class="clear-log" id="clearLogBtn2">清空</button>
            </div>
            <div class="log-area" id="logArea">
                <div class="log-entry"><span class="time">[系统]</span> 等待操作...</div>
            </div>
        </div>
    </div>

    <!-- ===== 管理员登录弹窗 ===== -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-modal">
            <h2>🔐 管理员认证</h2>
            <div class="subtitle">请输入用户名和密码</div>
            <input type="text" id="loginUsername" placeholder="用户名" autocomplete="off" />
            <input type="password" id="loginPassword" placeholder="密码" autocomplete="off" />
            <button class="login-btn" id="loginBtn">登 录</button>
            <div class="login-msg" id="loginMsg"></div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ================================================================
            //  管理员登录验证（Base64 解码）
            // ================================================================
            const loginOverlay = document.getElementById('loginOverlay');
            const loginBtn = document.getElementById('loginBtn');
            const loginUsername = document.getElementById('loginUsername');
            const loginPassword = document.getElementById('loginPassword');
            const loginMsg = document.getElementById('loginMsg');

            loginBtn.addEventListener('click', handleLogin);
            loginPassword.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') handleLogin();
            });

            function handleLogin() {
                const user = loginUsername.value.trim();
                const pass = loginPassword.value;
                if (!user || !pass) {
                    displayLoginMsg('请输入用户名和密码');
                    return;
                }

                fetch('user/text.txt', { cache: 'no-cache' })
                    .then(response => {
                        if (!response.ok) throw new Error('无法读取认证文件');
                        return response.text();
                    })
                    .then(encoded => {
                        let decoded;
                        try {
                            decoded = atob(encoded.trim());
                        } catch (e) {
                            throw new Error('Base64 解码失败');
                        }
                        const lines = decoded.split(/\r?\n/);
                        const fileUser = (lines[0] || '').trim();
                        const filePass = (lines[1] || '').trim();

                        if (user === fileUser && pass === filePass) {
                            loginOverlay.classList.add('fade-out');
                            setTimeout(() => {
                                loginOverlay.style.display = 'none';
                            }, 400);
                            if (!initialLogged) {
                                initialLogged = true;
                                log('✅ 管理员验证成功，欢迎使用调试台！', 'success');
                                log('🔧 调试台已就绪，点击上方按钮测试 API', 'success');
                                log('💡 支持多种壁纸 API，包含 CORS 检测', 'info');
                                log('📋 所有结果会显示在日志中，可复制反馈', 'info');
                                console.log('🖼️ 壁纸API调试台已启动');
                                console.log('📌 各API说明:');
                                Object.keys(APIS).forEach(key => {
                                    console.log(`  - ${APIS[key].name}: ${APIS[key].desc}`);
                                });
                                document.getElementById('userPanel').style.display = 'block';
                                // 先加载用户数据，再启动在线监听
                                loadUserData();
                                initOnlineCounter();
                            }
                        } else {
                            displayLoginMsg('用户名或密码错误');
                            loginPassword.value = '';
                        }
                    })
                    .catch(err => {
                        console.error('认证失败：', err);
                        displayLoginMsg('认证服务不可用，请联系管理员');
                    });
            }

            function displayLoginMsg(msg) {
                loginMsg.textContent = msg;
            }

            // ================================================================
            //  核心功能
            // ================================================================
            const logArea = document.getElementById('logArea');
            const previewArea = document.getElementById('previewArea');
            const placeholder = document.getElementById('placeholder');
            const statusBadge = document.getElementById('statusBadge');
            const imageInfo = document.getElementById('imageInfo');

            let currentObjectURL = null;
            let initialLogged = false;

            // 日志函数
            function log(message, type, extra) {
                const time = new Date().toLocaleTimeString();
                const entry = document.createElement('div');
                entry.className = 'log-entry';

                let typeClass = 'info';
                let typeLabel = 'INFO';
                if (type === 'success') { typeClass = 'success'; typeLabel = '✅'; }
                if (type === 'error') { typeClass = 'error'; typeLabel = '❌'; }
                if (type === 'warn') { typeClass = 'warn'; typeLabel = '⚠️'; }
                if (type === 'data') { typeClass = 'data'; typeLabel = '📦'; }
                if (type === 'url') { typeClass = 'url'; typeLabel = '🔗'; }
                if (type === 'status') { typeClass = 'status-code'; typeLabel = '📡'; }

                let content = message;
                if (extra) {
                    content += ' ' + extra;
                }

                entry.innerHTML = `<span class="time">[${time}]</span><span class="${typeClass}">${typeLabel}</span> ${content}`;
                logArea.appendChild(entry);
                logArea.scrollTop = logArea.scrollHeight;
            }

            function clearLogs() {
                logArea.innerHTML = '';
                log('日志已清空', 'warn');
            }

            function setStatus(text, type) {
                statusBadge.textContent = text;
                statusBadge.className = 'status-badge ' + type;
            }

            function showImage(url, info) {
                placeholder.style.display = 'none';
                previewArea.style.backgroundImage = 'url("' + url + '")';
                previewArea.classList.remove('has-error');
                previewArea.classList.add('has-image');
                setStatus('✅ 加载成功', 'success');
                if (info) {
                    imageInfo.textContent = info;
                } else {
                    imageInfo.textContent = '图片已加载';
                }
            }

            function showError(text) {
                placeholder.style.display = 'flex';
                previewArea.style.backgroundImage = '';
                previewArea.classList.remove('has-image');
                previewArea.classList.add('has-error');
                setStatus('❌ 加载失败', 'fail');
                imageInfo.textContent = text || '加载失败';
                placeholder.innerHTML = `
                    <span>❌</span>
                    ${text || '加载失败'}
                `;
            }

            function showPlaceholder(text) {
                placeholder.style.display = 'flex';
                previewArea.style.backgroundImage = '';
                previewArea.classList.remove('has-image', 'has-error');
                setStatus('等待测试', 'idle');
                imageInfo.textContent = '';
                placeholder.innerHTML = `
                    <span>🖼️</span>
                    ${text || '点击上方按钮测试 API'}
                `;
            }

            function revokeObjectURL() {
                if (currentObjectURL) {
                    URL.revokeObjectURL(currentObjectURL);
                    currentObjectURL = null;
                }
            }

            // ================================================================
            //  测试函数
            // ================================================================
            function testApi(url, name) {
                revokeObjectURL();
                log(`开始测试: ${name}`, 'info');
                log(`请求地址: ${url}`, 'url');
                setStatus('加载中...', 'loading');
                showPlaceholder('加载中...');

                const startTime = Date.now();

                fetch(url, {
                        redirect: 'follow',
                        mode: 'cors',
                        cache: 'no-cache'
                    })
                    .then(response => {
                        const elapsed = Date.now() - startTime;
                        log(`响应状态: ${response.status} ${response.statusText} (${elapsed}ms)`, 'status');

                        const headers = {};
                        response.headers.forEach((value, key) => {
                            headers[key] = value;
                        });
                        log(`响应头: ${JSON.stringify(headers, null, 2)}`, 'data');

                        if (!response.ok) {
                            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                        }

                        const contentType = response.headers.get('content-type') || '';
                        log(`Content-Type: ${contentType}`, 'data');

                        return response.blob();
                    })
                    .then(blob => {
                        const elapsed = Date.now() - startTime;
                        log(`获取到 Blob: ${blob.size} bytes, type: ${blob.type} (${elapsed}ms)`, 'success');

                        if (!blob.type.startsWith('image/')) {
                            log(`⚠️ 返回的不是图片，是 ${blob.type}`, 'warn');
                            return blob.text().then(text => {
                                log(`返回内容预览: ${text.substring(0, 200)}...`, 'data');
                                setStatus('非图片内容', 'fail');
                                showError(`返回内容不是图片 (${blob.type})`);
                                throw new Error('返回内容不是图片');
                            });
                        }

                        const objectURL = URL.createObjectURL(blob);
                        currentObjectURL = objectURL;
                        const sizeKB = (blob.size / 1024).toFixed(1);
                        const img = new Image();
                        img.onload = function() {
                            const dim = `${img.naturalWidth}x${img.naturalHeight}`;
                            showImage(objectURL, `${name} · ${dim} · ${sizeKB}KB · ${blob.type}`);
                            log(`✅ ${name} 测试通过！(${sizeKB}KB, ${dim})`, 'success');
                        };
                        img.onerror = function() {
                            showImage(objectURL, `${name} · ${sizeKB}KB · ${blob.type}`);
                            log(`✅ ${name} 测试通过！(${sizeKB}KB)`, 'success');
                        };
                        img.src = objectURL;
                    })
                    .catch(err => {
                        const elapsed = Date.now() - startTime;
                        log(`❌ 请求失败: ${err.message} (${elapsed}ms)`, 'error');
                        log(`错误详情: ${err.stack || err}`, 'error');
                        setStatus('加载失败', 'fail');
                        showError(`${name}: ${err.message}`);
                    });
            }

            // ================================================================
            //  API 定义
            // ================================================================
            const APIS = {
                picsum: {
                    name: 'picsum.photos',
                    url: 'https://picsum.photos/1920/1080?t=' + Date.now(),
                    desc: '稳定随机图，支持 CORS'
                },
                unsplash: {
                    name: 'unsplash (source)',
                    url: 'https://source.unsplash.com/1920x1080/?nature,wallpaper&t=' + Date.now(),
                    desc: 'Unsplash 随机壁纸'
                },
                btstu: {
                    name: 'btstu.cn (动漫)',
                    url: 'https://api.btstu.cn/sjbz/api.php?lx=dongman&method=pc&format=images&t=' + Date.now(),
                    desc: '动漫壁纸 API'
                },
                xjh: {
                    name: 'img.xjh.me (岁月小筑)',
                    url: 'https://img.xjh.me/random_img.php?type=bg&ctype=acg&return=302&t=' + Date.now(),
                    desc: '302重定向，需跟随'
                },
                loli: {
                    name: 'loli API (随机图)',
                    url: 'https://api.lolicon.app/setu/v2?r18=0&num=1&size=original&t=' + Date.now(),
                    desc: 'Lolicon API 随机图'
                },
                loremflickr: {
                    name: 'loremflickr',
                    url: 'https://loremflickr.com/1920/1080?random=' + Date.now(),
                    desc: 'Lorem Flickr 随机图'
                },
                waifu: {
                    name: 'waifu.pics',
                    url: 'https://api.waifu.pics/sfw/wallpaper?t=' + Date.now(),
                    desc: '二次元壁纸 (JSON)'
                },
                bing: {
                    name: 'Bing每日壁纸',
                    url: 'https://api.btstu.cn/bing/api.php?format=images&t=' + Date.now(),
                    desc: 'Bing 每日壁纸 (btstu 代理)'
                }
            };

            // ================================================================
            //  ★★★ 全局变量：存储在线用户 ID ★★★
            // ================================================================
            let onlineUserIds = [];

            // ================================================================
            //  ★★★ 加载用户数据 ★★★
            // ================================================================
            async function loadUserData() {
                const tbody = document.getElementById('userTableBody');
                if (!tbody) return;
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#555;">加载中...</td></tr>';

                try {
                    const response = await fetch('/api/users');
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    const data = await response.json();
                    if (data.error) {
                        throw new Error(data.error);
                    }

                    const users = data.users || [];

                    if (users.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#555;">暂无用户</td></tr>';
                        return;
                    }

                    let html = '';
                    users.forEach(user => {
                        const isOnline = onlineUserIds.includes(user.id);
                        const lastSeen = user.last_seen ? new Date(user.last_seen).toLocaleString('zh-CN') : '从未';
                        const loginCount = user.login_count || 0;
                        html += `
                            <tr>
                                <td>${escapeHtml(user.username || '未命名')}</td>
                                <td>${escapeHtml(user.email)}</td>
                                <td>${loginCount}</td>
                                <td>${lastSeen}</td>
                                <td>
                                    <span class="online-dot ${isOnline ? 'online' : 'offline'}"></span>
                                    ${isOnline ? '在线' : '离线'}
                                </td>
                            </tr>
                        `;
                    });
                    tbody.innerHTML = html;

                } catch (err) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;color:#e74c3c;">加载失败: ${err.message}</td></tr>`;
                    log(`❌ 加载用户数据失败: ${err.message}`, 'error');
                }
            }

            // 简单的防 XSS
            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // ================================================================
            //  ★★★ 在线人数（Supabase Presence） ★★★
            // ================================================================
            let onlineChannel = null;

            async function initOnlineCounter() {
                try {
                    const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');

                    const SUPABASE_URL = '___PUBLIC_SUPABASE_URL___';
                    const SUPABASE_ANON_KEY = '___PUBLIC_SUPABASE_ANON_KEY___';

                    const finalUrl = SUPABASE_URL.startsWith('___')
                        ? 'https://dpzztlxwxxxyfiwcfcir.supabase.co'
                        : SUPABASE_URL;
                    const finalKey = SUPABASE_ANON_KEY.startsWith('___')
                        ? 'sb_publishable_IE7xGpNRnyig7Tz_rUI-dw_9PuBLS52'
                        : SUPABASE_ANON_KEY;

                    const supabase = createClient(finalUrl, finalKey);

                    const channel = supabase.channel('online-users', {
                        config: { presence: { key: 'user_id' } }
                    });

                    const onlineCountEl = document.getElementById('onlineCount');
                    if (!onlineCountEl) return;

                    // Presence 同步
                    channel.on('presence', { event: 'sync' }, () => {
                        const state = channel.presenceState();
                        onlineUserIds = Object.keys(state);
                        onlineCountEl.textContent = onlineUserIds.length || 0;
                        loadUserData();
                    });

                    // 用户加入
                    channel.on('presence', { event: 'join' }, () => {
                        setTimeout(() => {
                            const state = channel.presenceState();
                            onlineUserIds = Object.keys(state);
                            onlineCountEl.textContent = onlineUserIds.length;
                            loadUserData();
                        }, 150);
                    });

                    // 用户离开
                    channel.on('presence', { event: 'leave' }, () => {
                        setTimeout(() => {
                            const state = channel.presenceState();
                            onlineUserIds = Object.keys(state);
                            onlineCountEl.textContent = onlineUserIds.length;
                            loadUserData();
                        }, 150);
                    });

                    await channel.subscribe();
                    onlineChannel = channel;

                    // 首次加载
                    setTimeout(() => loadUserData(), 500);

                    // 每 30 秒刷新基本信息
                    setInterval(() => loadUserData(), 30000);

                    log('👥 在线人数统计已启动（实时同步）', 'success');
                } catch (err) {
                    console.warn('在线人数功能不可用:', err.message);
                    document.getElementById('onlineCount').textContent = '--';
                    loadUserData();
                }
            }

            // ================================================================
            //  绑定事件
            // ================================================================
            document.getElementById('testPicsum').addEventListener('click', function() {
                testApi(APIS.picsum.url, APIS.picsum.name);
            });
            document.getElementById('testUnsplash').addEventListener('click', function() {
                testApi(APIS.unsplash.url, APIS.unsplash.name);
            });
            document.getElementById('testBtstu').addEventListener('click', function() {
                testApi(APIS.btstu.url, APIS.btstu.name);
            });
            document.getElementById('testXjh').addEventListener('click', function() {
                testApi(APIS.xjh.url, APIS.xjh.name);
            });
            document.getElementById('testLoli').addEventListener('click', function() {
                testApi(APIS.loli.url, APIS.loli.name);
            });
            document.getElementById('testLoremFlickr').addEventListener('click', function() {
                testApi(APIS.loremflickr.url, APIS.loremflickr.name);
            });
            document.getElementById('testWaifu').addEventListener('click', function() {
                testApi(APIS.waifu.url, APIS.waifu.name);
            });
            document.getElementById('testBing').addEventListener('click', function() {
                testApi(APIS.bing.url, APIS.bing.name);
            });

            document.getElementById('testAll').addEventListener('click', function() {
                log('=== 全部测试开始 ===', 'warn');
                const keys = Object.keys(APIS);
                keys.forEach((key, index) => {
                    const api = APIS[key];
                    setTimeout(() => {
                        testApi(api.url, api.name);
                    }, index * 800);
                });
            });

            document.getElementById('testCustomUrl').addEventListener('click', function() {
                const url = document.getElementById('customUrlInput').value.trim();
                if (!url) {
                    log('⚠️ 请输入有效的图片 URL', 'warn');
                    return;
                }
                try {
                    new URL(url);
                } catch (e) {
                    log('❌ 无效的 URL 格式', 'error');
                    return;
                }
                testApi(url, '自定义URL');
            });
            document.getElementById('customUrlInput').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    document.getElementById('testCustomUrl').click();
                }
            });

            document.getElementById('testDelay').addEventListener('click', function() {
                log('⏱️ 开始延迟检测...', 'warn');
                const keys = Object.keys(APIS);
                let completed = 0;
                const total = keys.length;
                keys.forEach((key) => {
                    const api = APIS[key];
                    const start = Date.now();
                    fetch(api.url, { mode: 'no-cors' })
                        .then(() => {
                            const elapsed = Date.now() - start;
                            log(`${api.name} 延迟: ${elapsed}ms`, 'status');
                            completed++;
                            if (completed === total) {
                                log('✅ 延迟检测完成', 'success');
                            }
                        })
                        .catch(() => {
                            const elapsed = Date.now() - start;
                            log(`${api.name} 超时/失败 (${elapsed}ms)`, 'error');
                            completed++;
                            if (completed === total) {
                                log('✅ 延迟检测完成（部分失败）', 'warn');
                            }
                        });
                });
            });

            document.getElementById('exportLog').addEventListener('click', function() {
                const logs = logArea.innerText;
                if (!logs.trim()) {
                    log('⚠️ 日志为空，无法导出', 'warn');
                    return;
                }
                const blob = new Blob([logs], { type: 'text/plain;charset=utf-8' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `log_${new Date().toISOString().slice(0,10)}.txt`;
                a.click();
                URL.revokeObjectURL(a.href);
                log('📁 日志已导出', 'success');
            });

            document.getElementById('clearLogBtn').addEventListener('click', clearLogs);
            document.getElementById('clearLogBtn2').addEventListener('click', clearLogs);

            document.getElementById('clearBtn').addEventListener('click', function() {
                revokeObjectURL();
                clearLogs();
                showPlaceholder('已清空');
            });

            document.getElementById('refreshUsersBtn').addEventListener('click', function() {
                loadUserData();
                log('🔄 用户数据已刷新', 'info');
            });

        })();
    </script>
</body>
</html>
