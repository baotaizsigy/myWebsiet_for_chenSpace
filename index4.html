<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5" />
    <title>关于 · chen_space</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ===== 重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Helvetica Neue', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            color: white;
            background-color: #0a1220;
            background-image: url('img5.jpg');
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            overflow: hidden;
            position: relative;
            padding-top: 80px;
        }

        body.dark-mode {
            background-image: none !important;
            background-color: #000000 !important;
        }

        /* ================================================================
               导航栏
               ================================================================ */
        .navbar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 700px;
            padding: 12px 24px;
            background: rgba(10, 10, 30, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 1000;
            -webkit-mask-image: linear-gradient(to right, transparent 0%, black 2%, black 98%, transparent 100%);
            mask-image: linear-gradient(to right, transparent 0%, black 2%, black 98%, transparent 100%);
            -webkit-mask-size: 0% 100%;
            mask-size: 0% 100%;
            -webkit-mask-position: center;
            mask-position: center;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            opacity: 0;
            animation: navbarExpand 1s cubic-bezier(0.23, 1, 0.32, 1) forwards;
            animation-delay: 0.05s;
            animation-fill-mode: forwards;
        }

        .navbar.mask-done {
            -webkit-mask-image: none !important;
            mask-image: none !important;
        }

        @keyframes navbarExpand {
            0% {
                -webkit-mask-size: 0% 100%;
                mask-size: 0% 100%;
                opacity: 0;
            }
            60% {
                opacity: 1;
            }
            100% {
                -webkit-mask-size: 100% 100%;
                mask-size: 100% 100%;
                opacity: 1;
            }
        }

        @media (min-width: 768px) {
            .navbar {
                width: calc(100% - 48px);
                max-width: 100%;
                padding: 14px 32px;
            }
        }

        @media (min-width: 1024px) {
            .navbar {
                width: calc(100% - 64px);
                max-width: 100%;
                padding: 14px 38px;
            }
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            z-index: 2;
        }

        .device-indicator {
            font-size: 0.75rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            white-space: nowrap;
            letter-spacing: 0.3px;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .nav-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 0.8px;
            white-space: nowrap;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .nav-center {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            min-height: 2.2rem;
            padding: 0 8px;
            opacity: 0;
            transform: translateY(-28px);
            animation: slideDownCaillo 1s cubic-bezier(0.23, 1, 0.32, 1) forwards;
            animation-delay: 0.15s;
            position: relative;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes slideDownCaillo {
            0% {
                opacity: 0;
                transform: translateY(-30px);
            }
            60% {
                opacity: 0.8;
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .nav-center.minimized {
            transform: translateX(-40px);
            opacity: 0.6;
        }

        .nav-text {
            font-size: 1.1rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.75);
            letter-spacing: 1.5px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            white-space: nowrap;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            transition: opacity 0.45s cubic-bezier(0.23, 1, 0.32, 1),
                transform 0.45s cubic-bezier(0.23, 1, 0.32, 1);
            will-change: transform, opacity;
        }

        .nav-text.fade-out {
            opacity: 0;
            transform: translateY(-12px);
        }

        .nav-text.fade-in {
            opacity: 1;
            transform: translateY(0);
        }

        @media (min-width: 768px) {
            .nav-text {
                font-size: 1.3rem;
                letter-spacing: 2px;
            }
        }

        @media (min-width: 1024px) {
            .nav-text {
                font-size: 1.5rem;
                letter-spacing: 2.5px;
            }
        }

        @media (max-width: 600px) {
            .nav-center {
                display: none;
            }
        }

        .nav-buttons {
            display: flex;
            gap: 12px;
            flex-shrink: 0;
            z-index: 2;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            align-items: center;
        }

        /* ★★★ 修复：移除多余的分号 ★★★ */
        .nav-buttons.minimized {
            /* 最小化时不做偏移，避免按钮凸出 */
        }

        .nav-btn {
            padding: 6px 22px;
            border: none;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            letter-spacing: 0.5px;
            font-family: inherit;
            white-space: nowrap;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: scale(1.04);
            border-color: rgba(255, 255, 255, 0.2);
            color: white;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.08);
        }

        .nav-btn:active {
            transform: scale(0.96);
        }

        @media (max-width: 480px) {
            .nav-btn {
                padding: 4px 14px;
                font-size: 0.75rem;
            }
            .nav-title {
                font-size: 0.9rem;
            }
            .device-indicator {
                font-size: 0.6rem;
                padding: 1px 8px;
            }
        }

        @media (max-width: 380px) {
            .nav-btn {
                padding: 3px 10px;
                font-size: 0.65rem;
            }
            .nav-title {
                font-size: 0.75rem;
            }
            .device-indicator {
                font-size: 0.5rem;
                padding: 1px 6px;
            }
        }

        /* ===== 最小化还原按钮 ===== */
        #restoreFromNav {
            display: none;
            padding: 4px 16px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            white-space: nowrap;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            order: -1;
        }
        #restoreFromNav:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.04);
        }
        #restoreFromNav:active {
            transform: scale(0.95);
        }
        #restoreFromNav.show {
            display: inline-block;
            animation: restoreBtnIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes restoreBtnIn {
            0% {
                opacity: 0;
                transform: scale(0.7) translateX(20px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateX(0);
            }
        }

        /* ================================================================
               窗口（可拖动）
               ================================================================ */
        #windowWrapper {
            width: 1100px;
            max-width: 95vw;
            height: 640px;
            max-height: 80vh;
            margin: 24px auto 0 auto;
            transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1),
                height 0.6s cubic-bezier(0.34, 1.56, 0.64, 1),
                max-width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1),
                max-height 0.6s cubic-bezier(0.34, 1.56, 0.64, 1),
                opacity 0.5s ease,
                transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: center center;
            position: relative;
        }

        #windowWrapper.dragging {
            transition: none !important;
        }

        #windowWrapper.maximized {
            width: 98vw;
            height: calc(100vh - 80px - 24px - 30px);
            max-width: 98vw;
            max-height: calc(100vh - 80px - 24px - 30px);
            margin-top: 24px;
        }

        #windowWrapper.minimized {
            transform: scale(0.3) translateY(calc(-80vh)) !important;
            opacity: 0;
            pointer-events: none;
            max-height: 0;
            height: 0;
            width: 0;
            overflow: hidden;
            margin-top: 0;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* ===== 主窗口 ===== */
        #app {
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-radius: 32px;
            border: 1.5px solid rgba(255, 255, 255, 0.20);
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.5),
                inset 0 0 0 1px rgba(255, 255, 255, 0.04);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            color: #fff;
            position: relative;
            z-index: 1;
            cursor: default;
        }

        /* ===== 窗口标题栏 ===== */
        .win-titlebar {
            display: flex;
            align-items: center;
            padding: 12px 20px 10px 20px;
            background: transparent;
            flex-shrink: 0;
            user-select: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            gap: 16px;
            min-height: 52px;
            flex-shrink: 0;
            cursor: grab;
        }
        .win-titlebar:active {
            cursor: grabbing;
        }

        .win-titlebar-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            z-index: 2;
            pointer-events: none;
        }
        .win-titlebar-left .win-controls {
            pointer-events: auto;
        }

        .win-controls {
            display: flex;
            gap: 10px;
        }

        .win-controls span {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: inline-block;
            transition: transform 0.2s ease, opacity 0.2s ease;
            cursor: pointer;
            position: relative;
        }
        .win-controls span:hover {
            transform: scale(1.15);
        }
        .win-controls span:active {
            transform: scale(0.9);
        }
        .win-controls .red-btn {
            background: #ff5f57;
        }
        .win-controls .yellow-btn {
            background: #ffbd2e;
        }
        .win-controls .green-btn {
            background: #28c840;
        }

        .win-titlebar-center {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-width: 0;
            pointer-events: none;
        }
        .win-titlebar-center .icon {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.4);
            flex-shrink: 0;
        }
        .win-titlebar-center h1 {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            letter-spacing: -0.3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .win-titlebar-right {
            flex-shrink: 0;
            width: 68px;
            pointer-events: none;
        }

        /* ===== 主体 ===== */
        .win-main {
            display: flex;
            flex: 1;
            overflow: hidden;
            padding: 0 16px 16px 16px;
            gap: 16px;
            min-height: 0;
        }

        /* ===== 左侧导航 ===== */
        .win-nav {
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            width: 200px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 18px 14px 14px 14px;
            height: 100%;
            align-items: center;
            overflow-y: auto;
        }
        .win-nav::-webkit-scrollbar {
            width: 3px;
        }
        .win-nav::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 8px;
        }

        .win-avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid rgba(255, 255, 255, 0.10);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            flex-shrink: 0;
            cursor: default;
            font-size: 2.2rem;
        }

        .win-profile-name {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            text-align: center;
            letter-spacing: -0.2px;
        }
        .win-profile-title {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.30);
            text-align: center;
            margin-bottom: 14px;
            font-weight: 300;
        }

        .win-nav-divider {
            width: 50%;
            height: 1px;
            background: rgba(255, 255, 255, 0.04);
            margin: 2px 0 12px 0;
            flex-shrink: 0;
        }

        .win-nav-links {
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 2px;
            flex: 1;
        }
        .win-nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 14px;
            border-radius: 14px;
            color: rgba(255, 255, 255, 0.35);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            background: transparent;
            border: none;
            width: 100%;
            text-align: left;
            font-family: inherit;
        }
        .win-nav-link i {
            font-size: 16px;
            width: 22px;
            text-align: center;
            color: rgba(255, 255, 255, 0.15);
            transition: color 0.25s;
        }
        .win-nav-link:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
        }
        .win-nav-link:hover i {
            color: rgba(255, 255, 255, 0.4);
        }
        .win-nav-link.active {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .win-nav-link.active i {
            color: #fff;
        }

        /* 窗口左下角社交图标 */
        .win-nav-social {
            display: flex;
            gap: 12px;
            margin-top: 6px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            width: 100%;
            justify-content: center;
            flex-shrink: 0;
        }
        .win-nav-social a {
            color: rgba(255, 255, 255, 0.15);
            font-size: 16px;
            transition: color 0.3s, transform 0.2s;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .win-nav-social a:hover {
            color: #fff;
            transform: scale(1.1);
        }

        /* ===== 窗口内容 ===== */
        .win-content {
            flex: 1;
            background: rgba(255, 255, 255, 0.01);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 22px 26px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.03);
            min-width: 0;
        }
        .win-content::-webkit-scrollbar {
            width: 4px;
        }
        .win-content::-webkit-scrollbar-track {
            background: transparent;
        }
        .win-content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 8px;
        }

        .win-page {
            display: none;
            animation: pageEnter 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        .win-page.active {
            display: block;
        }
        @keyframes pageEnter {
            0% {
                opacity: 0;
                transform: translateY(10px) scale(0.98);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .win-page h2 {
            font-size: 21px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .win-page h2 i {
            color: rgba(255, 255, 255, 0.15);
            font-size: 18px;
        }

        .win-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 18px;
            padding: 16px 20px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.03);
            transition: all 0.3s ease;
        }
        .win-card:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.10);
        }
        .win-card .card-title {
            font-size: 14px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.65);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .win-card .card-title i {
            color: rgba(255, 255, 255, 0.12);
            font-size: 14px;
        }
        .win-card .card-body {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.50);
            line-height: 1.7;
        }
        .win-card .card-body strong {
            color: rgba(255, 255, 255, 0.75);
            font-weight: 600;
        }

        .tag {
            padding: 3px 14px;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 12px;
            color: rgba(255, 255, 255, 0.35);
            display: inline-block;
            transition: all 0.2s;
        }
        .tag:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.08);
        }

        /* 联系按钮 */
        .contact-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 40px;
            padding: 8px 24px 8px 20px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            cursor: pointer;
            font-family: inherit;
            line-height: 1;
        }
        .contact-btn:hover {
            background: rgba(255, 255, 255, 0.10);
            transform: scale(1.04);
            color: #fff;
        }
        .contact-btn:active {
            transform: scale(0.94);
        }

        .contact-wrapper {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 4px 0;
        }
        .contact-wrapper .icon {
            width: 20px;
            text-align: center;
            font-size: 16px;
        }
        .contact-wrapper .icon.qq {
            color: #12b7f5;
        }
        .contact-wrapper .icon.email {
            color: rgba(255, 255, 255, 0.3);
        }
        .contact-wrapper .icon.bilibili {
            color: #00a1d6;
        }

        .contact-btn-qq:hover {
            border-color: #12b7f5;
            box-shadow: 0 0 28px rgba(18, 183, 245, 0.25);
        }
        .contact-btn-email:hover {
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 28px rgba(255, 255, 255, 0.05);
        }
        .contact-btn-bilibili:hover {
            border-color: #00a1d6;
            box-shadow: 0 0 28px rgba(0, 161, 214, 0.25);
        }

        /* ================================================================
               虚拟弹窗
               ================================================================ */
        .virtual-modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            animation: modalFadeIn 0.3s ease;
        }
        .virtual-modal-overlay.active {
            display: flex;
        }

        @keyframes modalFadeIn {
            0% {
                opacity: 0;
                transform: scale(0.95);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .virtual-modal-box {
            background: rgba(30, 35, 45, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 32px 36px;
            max-width: 400px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            color: #fff;
            position: relative;
            text-align: center;
            animation: modalBoxIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes modalBoxIn {
            0% {
                opacity: 0;
                transform: scale(0.9) translateY(20px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .virtual-modal-close {
            position: absolute;
            top: 12px;
            right: 16px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.3);
            font-size: 24px;
            cursor: pointer;
            transition: color 0.2s, transform 0.2s;
            font-family: inherit;
            padding: 0 8px;
        }
        .virtual-modal-close:hover {
            color: #fff;
            transform: scale(1.1);
        }
        .virtual-modal-close:active {
            transform: scale(0.9);
        }

        .virtual-modal-icon {
            font-size: 48px;
            margin-bottom: 12px;
            display: block;
        }
        .virtual-modal-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .virtual-modal-desc {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 16px;
            line-height: 1.6;
            word-break: break-all;
        }
        .virtual-modal-btn {
            padding: 8px 28px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: inherit;
        }
        .virtual-modal-btn:hover {
            background: rgba(255, 255, 255, 0.16);
            transform: scale(1.04);
        }
        .virtual-modal-btn:active {
            transform: scale(0.95);
        }

    <div class="virtual-modal-overlay" id="virtualModal">

            <span class="virtual-modal-icon" id="modalIcon">💬</span>
            <div class="virtual-modal-title" id="modalTitle">标题</div>
            <div class="virtual-modal-desc" id="modalDesc">内容</div>
            <button class="virtual-modal-btn" id="virtualModalBtn">知道了</button>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            //  1. 导航切换（窗口内）
            // ============================================================
            const navLinks = document.querySelectorAll('.win-nav-link');
            const pages = {
                about: document.getElementById('page-about'),
                contact: document.getElementById('page-contact'),
            };

            navLinks.forEach(link => {
                link.addEventListener('click', function() {
                    navLinks.forEach(l => l.classList.remove('active'));
                    this.classList.add('active');

                    const pageId = this.dataset.page;
                    Object.values(pages).forEach(p => p?.classList.remove('active'));
                    if (pages[pageId]) {
                        const page = pages[pageId];
                        page.classList.remove('active');
                        void page.offsetWidth;
                        page.classList.add('active');
                    }
                });
            });

            // ============================================================
            //  2. 虚拟弹窗
            // ============================================================
            const modalOverlay = document.getElementById('virtualModal');
            const modalClose = document.getElementById('virtualModalClose');
            const modalIcon = document.getElementById('modalIcon');
            const modalTitle = document.getElementById('modalTitle');
            const modalDesc = document.getElementById('modalDesc');
            const modalBtn = document.getElementById('virtualModalBtn');

            function showModal(icon, title, desc) {
                modalIcon.textContent = icon || '💬';
                modalTitle.textContent = title || '提示';
                modalDesc.textContent = desc || '';
                modalOverlay.classList.add('active');
            }

            function closeModal() {
                modalOverlay.classList.remove('active');
            }

            modalClose.addEventListener('click', closeModal);
            modalBtn.addEventListener('click', closeModal);
            modalOverlay.addEventListener('click', function(e) {
                if (e.target === modalOverlay) closeModal();
            });

            // ============================================================
            //  3. 窗口左下角社交图标
            // ============================================================
            document.getElementById('socialQQ').addEventListener('click', function(e) {
                e.preventDefault();
                showModal('🐧', 'QQ', '3836729616');
            });

            document.getElementById('socialBilibili').addEventListener('click', function(e) {
                e.preventDefault();
                showModal('📺', 'B站空间', 'https://space.bilibili.com/3493293233015567\n点击下方按钮跳转');
                const btn = document.getElementById('virtualModalBtn');
                const oldClick = btn._listener;
                if (oldClick) btn.removeEventListener('click', oldClick);
                const newListener = function() {
                    window.open('https://space.bilibili.com/3493293233015567', '_blank');
                    closeModal();
                };
                btn._listener = newListener;
                btn.addEventListener('click', newListener);
                btn.textContent = '前往 B站 →';
                const restoreBtnFunc = function() {
                    btn.textContent = '知道了';
                    btn.removeEventListener('click', newListener);
                    btn._listener = null;
                    modalOverlay.removeEventListener('click', restoreBtnFunc);
                };
                modalOverlay.addEventListener('click', restoreBtnFunc);
                const origClose = modalClose._listener;
                modalClose._listener = function() {
                    restoreBtnFunc();
                    closeModal();
                };
                modalClose.removeEventListener('click', modalClose._listener);
                modalClose.addEventListener('click', modalClose._listener);
            });

            // ============================================================
            //  4. 窗口拖拽
            // ============================================================
            const wrapper = document.getElementById('windowWrapper');
            const dragHandle = document.getElementById('dragHandle');
            let isDragging = false;
            let dragStartX = 0,
                dragStartY = 0;
            let currentTranslateX = 0,
                currentTranslateY = 0;

            function getCurrentTranslate() {
                const style = window.getComputedStyle(wrapper);
                const transform = style.transform;
                if (transform === 'none') return { x: 0, y: 0 };
                const matrix = transform.match(/matrix.*\((.+)\)/);
                if (matrix) {
                    const values = matrix[1].split(', ');
                    if (values.length === 6) {
                        return { x: parseFloat(values[4]) || 0, y: parseFloat(values[5]) || 0 };
                    }
                    if (values.length === 16) {
                        return { x: parseFloat(values[12]) || 0, y: parseFloat(values[13]) || 0 };
                    }
                }
                return { x: 0, y: 0 };
            }

            dragHandle.addEventListener('mousedown', function(e) {
                if (e.target.closest('.win-controls')) return;
                if (e.target.closest('.win-titlebar-center')) return;
                if (wrapper.classList.contains('minimized')) return;
                if (wrapper.classList.contains('maximized')) return;

                isDragging = true;
                const rect = wrapper.getBoundingClientRect();
                const pos = getCurrentTranslate();
                currentTranslateX = pos.x;
                currentTranslateY = pos.y;
                dragStartX = e.clientX - currentTranslateX;
                dragStartY = e.clientY - currentTranslateY;

                wrapper.classList.add('dragging');
                wrapper.style.transition = 'none';
                wrapper.style.marginLeft = 'auto';
                wrapper.style.marginRight = 'auto';

                e.preventDefault();
            });

            document.addEventListener('mousemove', function(e) {
                if (!isDragging) return;
                currentTranslateX = e.clientX - dragStartX;
                currentTranslateY = e.clientY - dragStartY;
                wrapper.style.transform = `translate(${currentTranslateX}px, ${currentTranslateY}px)`;
                e.preventDefault();
            });

            document.addEventListener('mouseup', function() {
                if (isDragging) {
                    isDragging = false;
                    wrapper.classList.remove('dragging');
                    wrapper.style.transition = '';
                    wrapper.style.transform = `translate(${currentTranslateX}px, ${currentTranslateY}px)`;
                    wrapper.dataset.hasCustomPosition = 'true';
                }
            });

            // ============================================================
            //  5. 窗口控制
            // ============================================================
            const restoreBtn = document.getElementById('restoreFromNav');
            const navCenter = document.getElementById('navCenter');
            const navButtons = document.getElementById('navButtons');

            let isMaximized = false;
            let isMinimized = false;
            let savedTranslateX = 0,
                savedTranslateY = 0;

            function savePosition() {
                const pos = getCurrentTranslate();
                savedTranslateX = pos.x;
                savedTranslateY = pos.y;
            }

            function restorePosition() {
                if (wrapper.dataset.hasCustomPosition === 'true') {
                    currentTranslateX = savedTranslateX;
                    currentTranslateY = savedTranslateY;
                    wrapper.style.transform = `translate(${savedTranslateX}px, ${savedTranslateY}px)`;
                } else {
                    wrapper.style.transform = '';
                    wrapper.style.marginLeft = 'auto';
                    wrapper.style.marginRight = 'auto';
                }
            }

            // 红按钮
            document.getElementById('redBtn').addEventListener('click', function() {
                window.location.href = 'index.html';
            });

            // 黄按钮
            document.getElementById('yellowBtn').addEventListener('click', function() {
                if (isMinimized) return;
                if (isMaximized) {
                    isMaximized = false;
                    wrapper.classList.remove('maximized');
                    wrapper.style.marginLeft = 'auto';
                    wrapper.style.marginRight = 'auto';
                    wrapper.style.transform = `translate(${currentTranslateX}px, ${currentTranslateY}px)`;
                    this.style.transform = '';
                    setTimeout(() => { this.style.transform = ''; }, 600);
                } else {
                    savePosition();
                    isMaximized = true;
                    wrapper.classList.add('maximized');
                    wrapper.style.transform = '';
                    wrapper.style.marginLeft = 'auto';
                    wrapper.style.marginRight = 'auto';
                    this.style.transform = 'scale(1.2)';
                    setTimeout(() => { this.style.transform = ''; }, 600);
                }
            });

            // 绿按钮
            const greenBtn = document.getElementById('greenBtn');

            function minimizeWindow() {
                if (isMinimized) return;
                if (isMaximized) {
                    isMaximized = false;
                    wrapper.classList.remove('maximized');
                }
                savePosition();
                isMinimized = true;
                wrapper.classList.add('minimized');
                wrapper.style.transform = '';
                restoreBtn.classList.add('show');
                navCenter.classList.add('minimized');
                navButtons.classList.add('minimized');
                greenBtn.style.transform = 'scale(0.8)';
                setTimeout(() => { greenBtn.style.transform = ''; }, 300);
            }

            function restoreWindow() {
                if (!isMinimized) return;
                isMinimized = false;
                wrapper.classList.remove('minimized');
                restoreBtn.classList.remove('show');
                navCenter.classList.remove('minimized');
                navButtons.classList.remove('minimized');
                restorePosition();
                greenBtn.style.transform = 'scale(1.1)';
                setTimeout(() => { greenBtn.style.transform = ''; }, 300);
            }

            greenBtn.addEventListener('click', function() {
                if (isMinimized) {
                    restoreWindow();
                } else {
                    minimizeWindow();
                }
            });

            restoreBtn.addEventListener('click', function() {
                restoreWindow();
            });

            document.querySelector('.win-titlebar').addEventListener('dblclick', function(e) {
                if (e.target.closest('.win-controls')) return;
                if (isMinimized) return;
                document.getElementById('yellowBtn').click();
            });

            // ============================================================
            //  6. 导航栏按钮
            // ============================================================
            document.getElementById('homeBtn').addEventListener('click', function() {
                window.location.href = 'index.html';
            });

            document.getElementById('shareBtn').addEventListener('click', function() {
                window.location.href = 'index2.html';
            });

            // ============================================================
            //  7. 设备检测
            // ============================================================
            function detectDevice() {
                const ua = navigator.userAgent;
                const isPhone = /Mobi|Android|iPhone|iPod/i.test(ua) && !/iPad/i.test(ua);
                document.getElementById('deviceIndicator').textContent = isPhone ? '📱 手机' : '💻 电脑';
            }
            detectDevice();

            // ============================================================
            //  8. 诗句切换
            // ============================================================
            const poems = [
                '花季莫浅忆，雨季莫愁离',
                '汴水流，泗水流，流到瓜州古渡头。吴山点点愁',
                '直道相思了无益，未妨惆怅是清狂',
                '人皆荒醉，但唱观音',
                '少年听雨歌楼上。红烛昏罗帐',
                '物是人非事事休，欲语泪先流'
            ];

            let poemSwitched = false;
            const navTextEl = document.getElementById('navText');

            function switchToPoem() {
                if (poemSwitched) return;
                poemSwitched = true;
                const randomPoem = poems[Math.floor(Math.random() * poems.length)];
                navTextEl.classList.add('fade-out');
                setTimeout(function() {
                    navTextEl.textContent = randomPoem;
                    const len = randomPoem.length;
                    let fontSize = 1.1;
                    if (len > 20) fontSize = 0.75;
                    else if (len > 14) fontSize = 0.85;
                    else if (len > 8) fontSize = 0.95;
                    const isWide = window.innerWidth >= 768;
                    if (isWide) fontSize *= 1.2;
                    if (window.innerWidth >= 1024) fontSize *= 1.3;
                    fontSize = Math.min(Math.max(fontSize, 0.7), 1.6);
                    navTextEl.style.fontSize = fontSize + 'rem';
                    navTextEl.classList.remove('fade-out');
                    void navTextEl.offsetWidth;
                    navTextEl.classList.add('fade-in');
                }, 450);
            }
            setTimeout(switchToPoem, 3000);

            // ============================================================
            //  9. 联系按钮（窗口内）
            // ============================================================
            document.getElementById('qqBtn').addEventListener('click', function() {
                showModal('🐧', 'QQ', '3836729616');
            });

            document.getElementById('emailBtn').addEventListener('click', function() {
                showModal('📧', '邮箱', '3836729616@qq.com');
            });

            document.getElementById('bilibiliBtn').addEventListener('click', function() {
                showModal('📺', 'B站空间', 'https://space.bilibili.com/3493293233015567\n点击下方按钮跳转');
                const btn = document.getElementById('virtualModalBtn');
                const oldClick = btn._listener;
                if (oldClick) btn.removeEventListener('click', oldClick);
                const newListener = function() {
                    window.open('https://space.bilibili.com/3493293233015567', '_blank');
                    closeModal();
                };
                btn._listener = newListener;
                btn.addEventListener('click', newListener);
                btn.textContent = '前往 B站 →';
                const restoreBtnFunc = function() {
                    btn.textContent = '知道了';
                    btn.removeEventListener('click', newListener);
                    btn._listener = null;
                    modalOverlay.removeEventListener('click', restoreBtnFunc);
                };
                modalOverlay.addEventListener('click', restoreBtnFunc);
                const origClose = modalClose._listener;
                modalClose._listener = function() {
                    restoreBtnFunc();
                    closeModal();
                };
                modalClose.removeEventListener('click', modalClose._listener);
                modalClose.addEventListener('click', modalClose._listener);
            });

            // ============================================================
            //  10. 窗口控制悬停
            // ============================================================
            document.querySelectorAll('.win-controls span').forEach(btn => {
                btn.addEventListener('mouseenter', function() {
                    this.style.opacity = '0.8';
                    this.style.transform = 'scale(1.1)';
                });
                btn.addEventListener('mouseleave', function() {
                    this.style.opacity = '1';
                    this.style.transform = 'scale(1)';
                });
            });

            // ============================================================
            //  11. 导航栏展开动画完成
            // ============================================================
            const navbarEl = document.getElementById('navbar');
            navbarEl.addEventListener('animationend', function(e) {
                if (e.animationName === 'navbarExpand') {
                    navbarEl.classList.add('mask-done');
                }
            });
            setTimeout(function() {
                if (!navbarEl.classList.contains('mask-done')) {
                    navbarEl.classList.add('mask-done');
                }
            }, 5000);

        })();
    </script>

</body>
