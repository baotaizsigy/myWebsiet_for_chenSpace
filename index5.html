<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5" />
    <title>我的 · chen_space</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ===== 重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Helvetica Neue', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            color: white;
            background-color: #0a1220;
            background-image: url('img7.jpg');
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            overflow: hidden;
            position: relative;
            padding-top: 80px;
        }

        body.dark-mode {
            background-image: none !important;
            background-color: #000000 !important;
        }

        /* ===== 导航栏 ===== */
        .navbar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 700px;
            padding: 12px 24px;
            background: rgba(10, 10, 30, 0.35);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 1000;
            -webkit-mask-image: linear-gradient(to right, transparent 0%, black 2%, black 98%, transparent 100%);
            mask-image: linear-gradient(to right, transparent 0%, black 2%, black 98%, transparent 100%);
            -webkit-mask-size: 0% 100%;
            mask-size: 0% 100%;
            -webkit-mask-position: center;
            mask-position: center;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            opacity: 0;
            animation: navbarExpand 1s cubic-bezier(0.23, 1, 0.32, 1) forwards;
            animation-delay: 0.05s;
            animation-fill-mode: forwards;
            overflow: hidden;
        }

        .navbar::before {
            content: '';
            position: absolute;
            inset: -50%;
            background: conic-gradient(from var(--angle, 0deg) at 50% 50%,
                    transparent 0%,
                    rgba(255, 255, 255, 0.04) 15%,
                    rgba(255, 255, 255, 0.08) 30%,
                    rgba(255, 255, 255, 0.04) 45%,
                    transparent 60%,
                    transparent 100%);
            animation: rotateGloss 8s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes rotateGloss {
            0% { --angle: 0deg; }
            100% { --angle: 360deg; }
        }

        @property --angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }

        .navbar.mask-done {
            -webkit-mask-image: none !important;
            mask-image: none !important;
        }

        @keyframes navbarExpand {
            0% {
                -webkit-mask-size: 0% 100%;
                mask-size: 0% 100%;
                opacity: 0;
            }
            60% { opacity: 1; }
            100% {
                -webkit-mask-size: 100% 100%;
                mask-size: 100% 100%;
                opacity: 1;
            }
        }

        @media (min-width: 768px) {
            .navbar {
                width: calc(100% - 48px);
                max-width: 100%;
                padding: 14px 32px;
            }
        }
        @media (min-width: 1024px) {
            .navbar {
                width: calc(100% - 64px);
                max-width: 100%;
                padding: 14px 38px;
            }
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            z-index: 2;
        }
        .device-indicator {
            font-size: 0.75rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            white-space: nowrap;
            letter-spacing: 0.3px;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .nav-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 0.8px;
            white-space: nowrap;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .nav-center {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            min-height: 2.2rem;
            padding: 0 8px;
            opacity: 0;
            transform: translateY(-28px);
            animation: slideDownCaillo 1s cubic-bezier(0.23, 1, 0.32, 1) forwards;
            animation-delay: 0.15s;
            position: relative;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes slideDownCaillo {
            0% { opacity: 0; transform: translateY(-30px); }
            60% { opacity: 0.8; }
            100% { opacity: 1; transform: translateY(0); }
        }

        .nav-text {
            font-size: 1.1rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.75);
            letter-spacing: 1.5px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            white-space: nowrap;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            transition: opacity 0.45s cubic-bezier(0.23, 1, 0.32, 1),
                transform 0.45s cubic-bezier(0.23, 1, 0.32, 1);
            will-change: transform, opacity;
        }
        .nav-text.fade-out {
            opacity: 0;
            transform: translateY(-12px);
        }
        .nav-text.fade-in {
            opacity: 1;
            transform: translateY(0);
        }
        @media (min-width: 768px) {
            .nav-text { font-size: 1.3rem; letter-spacing: 2px; }
        }
        @media (min-width: 1024px) {
            .nav-text { font-size: 1.5rem; letter-spacing: 2.5px; }
        }
        @media (max-width: 600px) {
            .nav-center { display: none; }
        }

        .nav-buttons {
            display: flex;
            gap: 12px;
            flex-shrink: 0;
            z-index: 2;
            align-items: center;
        }

        .nav-btn {
            padding: 6px 22px;
            border: none;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            letter-spacing: 0.5px;
            font-family: inherit;
            white-space: nowrap;
        }
        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: scale(1.04);
            border-color: rgba(255, 255, 255, 0.2);
            color: white;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.08);
        }
        .nav-btn:active {
            transform: scale(0.96);
        }

        @media (max-width: 480px) {
            .nav-btn { padding: 4px 14px; font-size: 0.75rem; }
            .nav-title { font-size: 0.9rem; }
            .device-indicator { font-size: 0.6rem; padding: 1px 8px; }
        }
        @media (max-width: 380px) {
            .nav-btn { padding: 3px 10px; font-size: 0.65rem; }
            .nav-title { font-size: 0.75rem; }
            .device-indicator { font-size: 0.5rem; padding: 1px 6px; }
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 32px;
            border-radius: 16px;
            backdrop-filter: blur(20px);
            background: rgba(20, 25, 40, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            color: #fff;
            font-size: 0.9rem;
            font-weight: 500;
            z-index: 9999;
            opacity: 0;
            transform: translateX(-50%) translateY(-20px);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            max-width: 90vw;
            text-align: center;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.error {
            border-color: rgba(255, 95, 87, 0.3);
            background: rgba(40, 20, 25, 0.9);
        }
        .toast.success {
            border-color: rgba(46, 204, 113, 0.3);
            background: rgba(20, 40, 30, 0.9);
        }

        /* ===== 窗口 ===== */
        #windowWrapper {
            width: 1100px;
            max-width: 95vw;
            height: 640px;
            max-height: 80vh;
            margin: 24px auto 0 auto;
            transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1),
                height 0.6s cubic-bezier(0.34, 1.56, 0.64, 1),
                max-width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1),
                max-height 0.6s cubic-bezier(0.34, 1.56, 0.64, 1),
                opacity 0.5s ease,
                transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: center center;
            position: relative;
            animation: windowEnter 0.8s cubic-bezier(0.23, 1, 0.32, 1) forwards;
            animation-delay: 0.2s;
            opacity: 0;
        }
        #windowWrapper.dragging {
            transition: none !important;
        }

        @keyframes windowEnter {
            0% {
                opacity: 0;
                transform: scale(0.9) translateY(20px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        #windowWrapper.maximized {
            width: 98vw;
            height: calc(100vh - 80px - 24px - 30px);
            max-width: 98vw;
            max-height: calc(100vh - 80px - 24px - 30px);
            margin-top: 24px;
        }

        /* ===== ★★★ 主窗口 — 增强模糊玻璃 ★★★ ===== */
        #app {
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.02);
            /* 更透的玻璃 */
            backdrop-filter: blur(64px) saturate(1.4);
            -webkit-backdrop-filter: blur(64px) saturate(1.4);
            border-radius: 32px;
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.6),
                inset 0 0 0 1px rgba(255, 255, 255, 0.03),
                0 0 100px rgba(100, 180, 255, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            color: #fff;
            position: relative;
            z-index: 1;
            cursor: default;
        }

        #app::before {
            content: '';
            position: absolute;
            inset: -50%;
            background: conic-gradient(from var(--gloss-angle, 0deg) at 50% 50%,
                    transparent 0%,
                    rgba(255, 255, 255, 0.02) 10%,
                    rgba(255, 255, 255, 0.05) 20%,
                    rgba(255, 255, 255, 0.08) 30%,
                    rgba(255, 255, 255, 0.05) 40%,
                    rgba(255, 255, 255, 0.02) 50%,
                    transparent 60%,
                    transparent 100%);
            animation: liquidGloss 12s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes liquidGloss {
            0% { --gloss-angle: 0deg; transform: rotate(0deg) scale(1); }
            50% { --gloss-angle: 180deg; transform: rotate(8deg) scale(1.02); }
            100% { --gloss-angle: 360deg; transform: rotate(0deg) scale(1); }
        }
        @property --gloss-angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }

        #app::after {
            content: '';
            position: absolute;
            inset: -100%;
            background: radial-gradient(ellipse at var(--mouse-x, 50%) var(--mouse-y, 50%),
                    rgba(255, 255, 255, 0.08) 0%,
                    rgba(255, 255, 255, 0.02) 30%,
                    transparent 70%);
            pointer-events: none;
            z-index: 0;
            transition: background 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        #app .border-glow {
            position: absolute;
            inset: -2px;
            border-radius: 34px;
            background: conic-gradient(from var(--border-angle, 0deg),
                    transparent 0%,
                    rgba(255, 255, 255, 0.08) 20%,
                    rgba(255, 255, 255, 0.15) 40%,
                    rgba(255, 255, 255, 0.08) 60%,
                    transparent 80%,
                    transparent 100%);
            animation: borderFlow 8s linear infinite;
            pointer-events: none;
            z-index: -1;
            opacity: 0.6;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            padding: 2px;
        }
        @keyframes borderFlow {
            0% { --border-angle: 0deg; }
            100% { --border-angle: 360deg; }
        }
        @property --border-angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }

        /* ===== 标题栏 ===== */
        .win-titlebar {
            display: flex;
            align-items: center;
            padding: 12px 20px 10px 20px;
            background: transparent;
            flex-shrink: 0;
            user-select: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            gap: 16px;
            min-height: 52px;
            cursor: grab;
            position: relative;
            z-index: 10;
        }
        .win-titlebar:active {
            cursor: grabbing;
        }

        .win-titlebar-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            z-index: 2;
            pointer-events: none;
        }
        .win-titlebar-left .win-controls {
            pointer-events: auto;
        }

        .win-controls {
            display: flex;
            gap: 10px;
        }
        .win-controls span {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: inline-block;
            transition: transform 0.2s ease, opacity 0.2s ease;
            cursor: pointer;
            position: relative;
        }
        .win-controls span:hover {
            transform: scale(1.15);
        }
        .win-controls span:active {
            transform: scale(0.9);
        }
        .win-controls .red-btn { background: #ff5f57; }
        .win-controls .yellow-btn { background: #ffbd2e; }
        .win-controls .green-btn { background: #28c840; }

        .win-titlebar-center {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-width: 0;
            pointer-events: none;
        }
        .win-titlebar-center .icon {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.4);
            flex-shrink: 0;
        }
        .win-titlebar-center h1 {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            letter-spacing: -0.3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .win-titlebar-right {
            flex-shrink: 0;
            width: 68px;
            pointer-events: none;
        }

        /* ===== 主体 ===== */
        .win-main {
            display: flex;
            flex: 1;
            overflow: hidden;
            padding: 0 16px 16px 16px;
            gap: 16px;
            min-height: 0;
            position: relative;
            z-index: 1;
        }

        /* ===== 左侧导航 ===== */
        .win-nav {
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            width: 200px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 18px 14px 14px 14px;
            height: 100%;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .win-nav::before {
            content: '';
            position: absolute;
            inset: -50%;
            background: conic-gradient(from var(--nav-angle, 0deg) at 50% 50%,
                    transparent 0%,
                    rgba(255, 255, 255, 0.03) 20%,
                    rgba(255, 255, 255, 0.06) 40%,
                    rgba(255, 255, 255, 0.03) 60%,
                    transparent 80%,
                    transparent 100%);
            animation: navGloss 10s linear infinite;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes navGloss {
            0% { --nav-angle: 0deg; }
            100% { --nav-angle: 360deg; }
        }
        @property --nav-angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }

        .win-avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid rgba(255, 255, 255, 0.10);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            flex-shrink: 0;
            cursor: default;
            font-size: 2.2rem;
            position: relative;
            z-index: 1;
        }
        .win-avatar .avatar-edit {
            position: absolute;
            bottom: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            cursor: pointer;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s;
        }
        .win-avatar .avatar-edit:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.1);
        }

        .win-profile-name {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            text-align: center;
            letter-spacing: -0.2px;
            position: relative;
            z-index: 1;
            margin-top: 4px;
        }
        .win-profile-email {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.30);
            text-align: center;
            margin-bottom: 14px;
            font-weight: 300;
            position: relative;
            z-index: 1;
            word-break: break-all;
        }

        .win-nav-divider {
            width: 50%;
            height: 1px;
            background: rgba(255, 255, 255, 0.04);
            margin: 2px 0 12px 0;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }

        .win-nav-links {
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 2px;
            flex: 1;
            position: relative;
            z-index: 1;
        }
        .win-nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 14px;
            border-radius: 14px;
            color: rgba(255, 255, 255, 0.35);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            background: transparent;
            border: none;
            width: 100%;
            text-align: left;
            font-family: inherit;
            position: relative;
        }
        .win-nav-link i {
            font-size: 16px;
            width: 22px;
            text-align: center;
            color: rgba(255, 255, 255, 0.15);
            transition: color 0.25s;
        }
        .win-nav-link:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
        }
        .win-nav-link:hover i {
            color: rgba(255, 255, 255, 0.4);
        }
        .win-nav-link.active {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .win-nav-link.active i {
            color: #fff;
        }

        .win-nav-footer {
            margin-top: auto;
            width: 100%;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            position: relative;
            z-index: 1;
        }

        /* ★★★ 虚拟退出按钮（侧边栏） ★★★ */
        .win-nav-link.danger {
            color: rgba(255, 95, 87, 0.5);
            background: transparent !important;
            border: 1px solid rgba(255, 95, 87, 0.15);
            border-radius: 14px;
            justify-content: center;
            margin-top: 4px;
            transition: all 0.3s ease;
        }
        .win-nav-link.danger:hover {
            color: #ff5f57 !important;
            border-color: rgba(255, 95, 87, 0.4);
            background: rgba(255, 95, 87, 0.04) !important;
            transform: scale(1.02);
        }
        .win-nav-link.danger i {
            color: rgba(255, 95, 87, 0.3);
        }
        .win-nav-link.danger:hover i {
            color: #ff5f57;
        }

        /* ===== 内容区 ===== */
        .win-content {
            flex: 1;
            background: rgba(255, 255, 255, 0.01);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 22px 28px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.03);
            min-width: 0;
            position: relative;
            z-index: 1;
        }
        .win-content::-webkit-scrollbar {
            width: 4px;
        }
        .win-content::-webkit-scrollbar-track {
            background: transparent;
        }
        .win-content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 8px;
        }

        /* ★★★ 页面切换核心 ★★★ */
        .win-page {
            display: none;
            animation: pageEnter 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        .win-page.active {
            display: block;
        }

        @keyframes pageEnter {
            0% { opacity: 0; transform: translateY(10px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 22px;
            flex-wrap: wrap;
        }
        .profile-header h2 {
            font-size: 21px;
            font-weight: 600;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .profile-header h2 i {
            color: rgba(255, 255, 255, 0.15);
            font-size: 18px;
        }

        /* ★★★ 只读展示卡片 ★★★ */
        .info-display {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .info-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.02);

        // ================================================================
        // 2. 配置
        // ================================================================
        const SUPABASE_URL = '___PUBLIC_SUPABASE_URL___';
        const SUPABASE_ANON_KEY = '___PUBLIC_SUPABASE_ANON_KEY___';

        const finalUrl = SUPABASE_URL.startsWith('___')
            ? 'https://dpzztlxwxxxyfiwcfcir.supabase.co'
            : SUPABASE_URL;
        const finalKey = SUPABASE_ANON_KEY.startsWith('___')
            ? 'sb_publishable_IE7xGpNRnyig7Tz_rUI-dw_9PuBLS52'
            : SUPABASE_ANON_KEY;

        const supabase = createClient(finalUrl, finalKey);

        // ================================================================
        // 3. 工具函数
        // ================================================================
        function showToast(message, type) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + (type || '') + ' show';
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => { toast.classList.remove('show'); }, 3500);
        }

        function setLoading(btn, loading) {
            if (loading) {
                btn.classList.add('loading');
                btn.disabled = true;
            } else {
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }

        // ================================================================
        // 4. 获取当前用户
        // ================================================================
        function getLocalSession() {
            try {
                const session = JSON.parse(localStorage.getItem('chen_session'));
                return session;
            } catch { return null; }
        }

        function getLocalUser() {
            const session = getLocalSession();
            return session?.user || null;
        }

        // ================================================================
        // 5. 页面状态
        // ================================================================
        let currentUser = null;
        let currentMeta = {};
        let originalData = {};
        let isDarkMode = false;

        // DOM 引用（展示）
        const displayUsername = document.getElementById('displayUsername');
        const displayEmail = document.getElementById('displayEmail');
        const displayLocation = document.getElementById('displayLocation');
        const displayBio = document.getElementById('displayBio');
        const profileName = document.getElementById('profileName');
        const profileEmail = document.getElementById('profileEmail');

        // DOM 引用（编辑）
        const editUsername = document.getElementById('editUsername');
        const editBio = document.getElementById('editBio');
        const editLocation = document.getElementById('editLocation');
        const saveBtn = document.getElementById('saveBtn');
        const resetBtn = document.getElementById('resetBtn');

        // 退出按钮
        const logoutBtn = document.getElementById('logoutBtn');
        const logoutBtn2 = document.getElementById('logoutBtn2');

        // ================================================================
        // 6. 页面切换函数
        // ================================================================
        function switchPage(pageId) {
            // 更新导航高亮
            const navLinks = document.querySelectorAll('.win-nav-link[data-page]');
            navLinks.forEach(link => {
                link.classList.toggle('active', link.dataset.page === pageId);
            });

            // 更新页面显示
            const pageIds = ['profile', 'stats', 'settings'];
            pageIds.forEach(id => {
                const page = document.getElementById(`page-${id}`);
                if (page) {
                    page.classList.toggle('active', id === pageId);
                }
            });
        }

        // ================================================================
        // 7. 加载用户数据
        // ================================================================
        async function loadUserData() {
            let user = getLocalUser();

            if (!user) {
                try {
                    const { data, error } = await supabase.auth.getSession();
                    if (error || !data.session) {
                        showToast('请先登录', 'error');
                        setTimeout(() => { window.location.href = 'login.html'; }, 1500);
                        return;
                    }
                    user = data.session.user;
                    localStorage.setItem('chen_session', JSON.stringify(data.session));
                } catch (e) {
                    showToast('会话已过期，请重新登录', 'error');
                    setTimeout(() => { window.location.href = 'login.html'; }, 1500);
                    return;
                }
            }

            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            currentUser = user;
            currentMeta = user.user_metadata || {};

            const username = currentMeta.username || user.email?.split('@')[0] || '用户';
            const bio = currentMeta.bio || '';
            const location = currentMeta.location || '';
            const email = user.email || '';

            // 保存原始数据
            originalData = { username, bio, location };

            // 更新展示区
            displayUsername.textContent = username;
            displayEmail.textContent = email;
            displayLocation.textContent = location || '未设置';
            displayBio.textContent = bio || '这个人很懒，什么都没写';
            profileName.textContent = username;
            profileEmail.textContent = email;

            // 更新编辑区
            editUsername.value = username;
            editBio.value = bio;
            editLocation.value = location;

            // 统计
            document.getElementById('statJoinDate').textContent = user.created_at
                ? new Date(user.created_at).toLocaleDateString('zh-CN')
                : '--';
            document.getElementById('statUserId').textContent = user.id ? user.id.substring(0, 12) + '...' : '--';
            document.getElementById('statStatus').textContent = user.email_confirmed_at ? '✅ 已验证' : '⏳ 未验证';
            document.getElementById('statProvider').textContent = user.app_metadata?.provider || '邮箱';

            console.log('✅ 用户数据加载完成:', username);

            // 默认显示个人资料页
            switchPage('profile');
        }

        // ================================================================
        // 8. 保存资料
        // ================================================================
        async function saveProfile() {
            const username = editUsername.value.trim();
            const bio = editBio.value.trim();
            const location = editLocation.value.trim();

            if (username.length < 2) {
                showToast('昵称至少2个字符', 'error');
                editUsername.focus();
                return;
            }
            if (username.length > 20) {
                showToast('昵称不能超过20个字符', 'error');
                editUsername.focus();
                return;
            }
            if (bio.length > 100) {
                showToast('个性签名不能超过100个字符', 'error');
                editBio.focus();
                return;
            }
            if (location.length > 50) {
                showToast('所在地不能超过50个字符', 'error');
                editLocation.focus();
                return;
            }

            setLoading(saveBtn, true);

            try {
                const { data, error } = await supabase.auth.updateUser({
                    data: {
                        username: username,
                        bio: bio,
                        location: location,
                    }
                });

                if (error) throw new Error(error.message);

                const session = getLocalSession();
                if (session) {
                    session.user = data.user;
                    localStorage.setItem('chen_session', JSON.stringify(session));
                }

                originalData = { username, bio, location };
                currentUser = data.user;
                currentMeta = data.user.user_metadata;

                displayUsername.textContent = username;
                displayLocation.textContent = location || '未设置';
                displayBio.textContent = bio || '这个人很懒，什么都没写';
                profileName.textContent = username;

                showToast('✅ 资料保存成功！', 'success');
            } catch (err) {
                showToast('❌ 保存失败: ' + err.message, 'error');
            } finally {
                setLoading(saveBtn, false);
            }
        }

        // ================================================================
        // 9. 撤销更改
        // ================================================================
        function resetChanges() {
            editUsername.value = originalData.username || '';
            editBio.value = originalData.bio || '';
            editLocation.value = originalData.location || '';
            showToast('已撤销更改', 'success');
        }

        // ================================================================
        // 10. 退出登录
        // ================================================================
        async function logout() {
            if (!confirm('确定要退出登录吗？')) return;

            try {
                await supabase.auth.signOut();
                localStorage.removeItem('chen_session');
                showToast('👋 已退出登录', 'success');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 600);
            } catch (err) {
                showToast('❌ 退出失败: ' + err.message, 'error');
            }
        }

        // ================================================================
        // 11. ★★★ 窗口拖拽（增强版 - 排除所有按钮） ★★★
        // ================================================================
        const wrapper = document.getElementById('windowWrapper');
        const dragHandle = document.getElementById('dragHandle');
        let isDragging = false;
        let dragStartX = 0, dragStartY = 0;
        let currentTranslateX = 0, currentTranslateY = 0;

        function getCurrentTranslate() {
            const style = window.getComputedStyle(wrapper);
            const transform = style.transform;
            if (transform === 'none') return { x: 0, y: 0 };
            const matrix = transform.match(/matrix.*\((.+)\)/);
            if (matrix) {
                const values = matrix[1].split(', ');
                if (values.length === 6) {
                    return { x: parseFloat(values[4]) || 0, y: parseFloat(values[5]) || 0 };
                }
            }
            return { x: 0, y: 0 };
        }

        dragHandle.addEventListener('mousedown', function(e) {
            // 如果点击的是控制按钮或任何按钮，不拖拽
            if (e.target.closest('.win-controls')) return;
            if (e.target.closest('button')) return;
            if (wrapper.classList.contains('maximized')) return;

            isDragging = true;
            const pos = getCurrentTranslate();
            currentTranslateX = pos.x;
            currentTranslateY = pos.y;
            dragStartX = e.clientX - currentTranslateX;
            dragStartY = e.clientY - currentTranslateY;

            wrapper.classList.add('dragging');
            wrapper.style.transition = 'none';
            wrapper.style.marginLeft = 'auto';
            wrapper.style.marginRight = 'auto';

            e.preventDefault();
        });

        document.addEventListener('mousemove', function(e) {
            if (!isDragging) return;
            currentTranslateX = e.clientX - dragStartX;
            currentTranslateY = e.clientY - dragStartY;
            wrapper.style.transform = `translate(${currentTranslateX}px, ${currentTranslateY}px)`;
            e.preventDefault();
        });

        document.addEventListener('mouseup', function() {
            if (isDragging) {
                isDragging = false;
                wrapper.classList.remove('dragging');
                wrapper.style.transition = '';
                wrapper.style.transform = `translate(${currentTranslateX}px, ${currentTranslateY}px)`;
                wrapper.dataset.hasCustomPosition = 'true';
            }
        });

        // 窗口控制按钮
        document.getElementById('redBtn').addEventListener('click', function() {
            window.location.href = 'index.html';
        });

        let isMaximized = false;
        document.getElementById('yellowBtn').addEventListener('click', function() {
            if (isMaximized) {
                isMaximized = false;
                wrapper.classList.remove('maximized');
                wrapper.style.marginLeft = 'auto';
                wrapper.style.marginRight = 'auto';
                wrapper.style.transform = `translate(${currentTranslateX}px, ${currentTranslateY}px)`;
            } else {
                const pos = getCurrentTranslate();
                currentTranslateX = pos.x;
                currentTranslateY = pos.y;
                isMaximized = true;
                wrapper.classList.add('maximized');
                wrapper.style.transform = '';
                wrapper.style.marginLeft = 'auto';
                wrapper.style.marginRight = 'auto';
            }
        });

        let isMinimized = false;
        document.getElementById('greenBtn').addEventListener('click', function() {
            if (isMinimized) {
                isMinimized = false;
                wrapper.style.transform = '';
                wrapper.style.opacity = '1';
                wrapper.style.pointerEvents = 'auto';
            } else {
                isMinimized = true;
                wrapper.style.transform = 'scale(0.1) translateY(-100vh)';
                wrapper.style.opacity = '0';
                wrapper.style.pointerEvents = 'none';
            }
        });

        // 双击标题栏最大化/还原
        document.querySelector('.win-titlebar').addEventListener('dblclick', function(e) {
            if (e.target.closest('.win-controls')) return;
            if (e.target.closest('button')) return;
            document.getElementById('yellowBtn').click();
        });

        // ================================================================
        // 12. 鼠标跟随光晕
        // ================================================================
        const appEl = document.getElementById('app');
        document.addEventListener('mousemove', function(e) {
            const rect = appEl.getBoundingClientRect();
            const x = ((e.clientX - rect.left) / rect.width * 100);
            const y = ((e.clientY - rect.top) / rect.height * 100);
            appEl.style.setProperty('--mouse-x', Math.min(100, Math.max(0, x)) + '%');
            appEl.style.setProperty('--mouse-y', Math.min(100, Math.max(0, y)) + '%');
        });
        appEl.addEventListener('mouseleave', function() {
            appEl.style.setProperty('--mouse-x', '50%');
            appEl.style.setProperty('--mouse-y', '50%');
        });

        // ================================================================
        // 13. 导航栏按钮
        // ================================================================
        document.getElementById('homeBtn').addEventListener('click', function() {
            window.location.href = 'index.html';
        });
        document.getElementById('shareBtn').addEventListener('click', function() {
            window.location.href = 'index2.html';
        });

        // ================================================================
        // 14. 设备检测 & 诗句
        // ================================================================
        function detectDevice() {
            const ua = navigator.userAgent;
            const isPhone = /Mobi|Android|iPhone|iPod/i.test(ua) && !/iPad/i.test(ua);
            document.getElementById('deviceIndicator').textContent = isPhone ? '📱 手机' : '💻 电脑';
        }
        detectDevice();

        const poems = ['我的地盘我做主', '记录每一刻', '做有趣的人', '代码与生活', '保持热爱'];
        let poemSwitched = false;
        const navTextEl = document.getElementById('navText');

        function switchToPoem() {
            if (poemSwitched) return;
            poemSwitched = true;
            const randomPoem = poems[Math.floor(Math.random() * poems.length)];
            navTextEl.classList.add('fade-out');
            setTimeout(function() {
                navTextEl.textContent = randomPoem;
                const len = randomPoem.length;
                let fontSize = 1.1;
                if (len > 12) fontSize = 0.9;
                const isWide = window.innerWidth >= 768;
                if (isWide) fontSize *= 1.2;
                if (window.innerWidth >= 1024) fontSize *= 1.3;
                fontSize = Math.min(Math.max(fontSize, 0.7), 1.6);
                navTextEl.style.fontSize = fontSize + 'rem';
                navTextEl.classList.remove('fade-out');
                void navTextEl.offsetWidth;
                navTextEl.classList.add('fade-in');
            }, 450);
        }
        setTimeout(switchToPoem, 3000);

        // ================================================================
        // 15. 主题切换
        // ================================================================
        document.getElementById('themeToggleBtn').addEventListener('click', function() {
            isDarkMode = !isDarkMode;
            document.body.classList.toggle('dark-mode', isDarkMode);
            this.querySelector('.btn-text').textContent = isDarkMode ? '☀️ 亮色' : '🌙 暗色';
            showToast(isDarkMode ? '🌙 已切换暗色模式' : '☀️ 已切换亮色模式', 'success');
        });

        // ================================================================
        // 16. 绑定事件
        // ================================================================
        // 导航链接点击切换页面
        document.querySelectorAll('.win-nav-link[data-page]').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                const pageId = this.dataset.page;
                switchPage(pageId);
            });
        });

        // 表单提交
        document.getElementById('profileForm').addEventListener('submit', function(e) {
            e.preventDefault();
            saveProfile();
        });

        saveBtn.addEventListener('click', function(e) {
            e.preventDefault();
            saveProfile();
        });

        resetBtn.addEventListener('click', resetChanges);

        logoutBtn.addEventListener('click', logout);
        logoutBtn2.addEventListener('click', logout);

        document.getElementById('avatarEditBtn').addEventListener('click', function() {
            showToast('💡 头像功能开发中，敬请期待', 'success');
        });

        // ================================================================
        // 17. 导航栏展开动画
        // ================================================================
        const navbarEl = document.getElementById('navbar');
        navbarEl.addEventListener('animationend', function(e) {
            if (e.animationName === 'navbarExpand') {
                navbarEl.classList.add('mask-done');
            }
        });
        setTimeout(function() {
            if (!navbarEl.classList.contains('mask-done')) {
                navbarEl.classList.add('mask-done');
            }
        }, 5000);

        // ================================================================
        // 18. 初始化
        // ================================================================
        console.log('👤 加载个人中心页面...');
        await loadUserData();
        console.log('✅ 个人中心初始化完成');

        window.__supabase = { supabase, getCurrentUser: async () => currentUser };
    </script>

</body>
</html>
